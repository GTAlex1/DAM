name: Supabase keepalive

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query damm
        env:
          SUPABASE_KEY: sb_publishable_vkMJHKoUCiaTGnSpycU7Bg_0-qlhKJc
          SUPABASE_URL: https://ywiprpasiafezfaajnfl.supabase.co
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 2 --output /dev/null \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/roles?select=*&limit=1"
