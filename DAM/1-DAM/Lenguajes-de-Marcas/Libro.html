'use strict';

const APP = {
  sello: '2026-08-12-2e32490',
  bloques: {
    '0': { n: 'Bloque 0', t: 'El terreno', d: 'Cómo funciona la web, archivos y rutas, herramientas. Tres sesiones antes de escribir marcado.' },
    '1': { n: 'Bloque 1', t: 'HTML y JSON', d: 'Marcado semántico, formularios, sintaxis JSON y los dos modelos de desarrollo web. Siete sesiones.' },
    '2': { n: 'Bloque 2', t: 'CSS', d: 'De la primera regla a una página maquetada y adaptable. Nueve sesiones.' },
    '3': { n: 'Bloque 3', t: 'Fundamentos de ES6', d: 'Variables, control, funciones, arrays, objetos, clases, módulos y almacenamiento. Diez sesiones.' },
    '4': { n: 'Bloque 4', t: 'DOM y eventos', d: 'La tercera capa, y el examen que cierra el primer trimestre. Nueve sesiones.' },
    '5': { n: 'Bloque 5', t: 'Asincronía y back', d: 'Callbacks, promesas, fetch, tu servidor, tokens y la capa HTTPClient. Once sesiones.' },
    '6': { n: 'Bloque 6', t: 'Arquitectura y proyecto', d: 'MVC, rutas, estados de interfaz, el proyecto de recetas y el examen final. Diez sesiones.' }
  },
  sesiones: [],
  conceptos: [],
  railAbierto: {},
  filtroRail: '',
  porId: {},
  refId: {},
  estado: null,
  vista: { v: 'curso', id: null }
};

/* ---------- Parseo ---------- */

function troceaBloques(txt, marca) {
  const lineas = txt.split('\n');
  const res = [];
  let act = null, cuerpo = null, sub = null;

  const esMarca = l => /^@[SGQEPVZK](\s|$)/.test(l);

  for (const l of lineas) {
    if (!esMarca(l)) {
      if (cuerpo) cuerpo.push(l);
      else if (sub) sub.push(l);
      continue;
    }
    const tipo = l[1];
    const resto = l.slice(2).trim();
    const r = { tipo, cab: resto, cuerpo: [] };
    if (act) act.partes.push(r);
    if (tipo === marca) {
      act = { cab: resto, partes: [] };
      res.push(act);
      cuerpo = null;
      continue;
    }
    cuerpo = r.cuerpo;
  }
  return res;
}

function parseaSesiones(txt) {
  const brutos = troceaBloques(txt, 'S');
  return brutos.map(b => {
    const [id, bloque, titulo, objetivo, conceptos] = b.cab.split('|');
    const s = {
      id, bloque, titulo, objetivo,
      conceptos: (conceptos || '').split(',').filter(Boolean),
      guion: '', diag: null, ejercicios: [], auto: []
    };
    let ejAct = null;
    for (const p of b.partes) {
      if (p.tipo === 'G') { s.guion = p.cuerpo.join('\n').trim(); ejAct = null; }
      else if (p.tipo === 'Q') {
        const q = leePregunta(p);
        if (q.clase === 'd') s.diag = q; else s.auto.push(q);
        ejAct = null;
      }
      else if (p.tipo === 'E') {
        const [carril, tit, entrega] = p.cab.split('|');
        ejAct = {
          carril, titulo: tit, entrega: entrega === '1',
          enunciado: p.cuerpo.join('\n').trim(),
          pistas: [], checks: [], solucion: ''
        };
        s.ejercicios.push(ejAct);
      }
      else if (p.tipo === 'P' && ejAct) ejAct.pistas.push(p.cab);
      else if (p.tipo === 'V' && ejAct) ejAct.checks.push(p.cab.split('|'));
      else if (p.tipo === 'Z' && ejAct) ejAct.solucion = p.cuerpo.join('\n').trim();
    }
    return s;
  });
}

function leePregunta(p) {
  const [clase, ...resto] = p.cab.split('|');
  const q = { clase, enunciado: resto.join('|'), opciones: [], buena: 0, explic: '' };
  let enExplic = false;
  for (const l of p.cuerpo) {
    const t = l.trim();
    if (t.startsWith('- ')) { q.opciones.push(t.slice(2)); enExplic = false; }
    else if (t.startsWith('* ')) { q.buena = q.opciones.length; q.opciones.push(t.slice(2)); enExplic = false; }
    else if (t.startsWith('> ')) { q.explic = t.slice(2); enExplic = true; }
    else if (enExplic && t) q.explic += ' ' + t;
  }
  return q;
}

function parseaConceptos(txt) {
  return troceaBloques(txt, 'K').map(b => {
    const [id, tema, titulo] = b.cab.split('|');
    const cuerpo = [];
    for (const p of b.partes) cuerpo.push(...p.cuerpo);
    return { id, tema, titulo, cuerpo: cuerpo.join('\n').trim() };
  });
}

/* El parser de arriba mete el cuerpo del bloque K en el propio bloque:
   ajuste para recoger las líneas que van justo detrás de la cabecera. */
function parseaConceptosPlano(txt) {
  const lineas = txt.split('\n');
  const res = [];
  let act = null;
  for (const l of lineas) {
    if (/^@K\s/.test(l)) {
      const [id, tema, titulo] = l.slice(3).trim().split('|');
      act = { id, tema, titulo, cuerpo: [] };
      res.push(act);
    } else if (act) act.cuerpo.push(l);
  }
  return res.map(c => ({ ...c, cuerpo: c.cuerpo.join('\n').trim() }));
}

/* ---------- Renderizador de texto ---------- */

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function linea(t) {
  let s = esc(t);
  const codigos = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => {
    codigos.push(c);
    return '\u0000' + (codigos.length - 1) + '\u0000';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(ref:([a-z0-9-]+)\)/g,
    (m, txt, id) => `<button class="ref" data-ref="${id}">${txt}</button>`);
  // Forma compacta: [[ficha]] o [[ficha|texto a mostrar]]
  s = s.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, txt) => {
    const c = APP.refId[id];
    if (!c) return `<span class="ref-rota" title="Ficha inexistente: ${id}">${txt || id}</span>`;
    return `<button class="ref" data-ref="${id}">${txt || esc(c.titulo)}</button>`;
  });
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codigos[+i] + '</code>');
  return s;
}

function anclaDe(txt) {
  return 'sec-' + String(txt)
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/`|\*/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 50);
}

/* Devuelve los apartados de nivel ## de un cuerpo, para el indice lateral. */
function indiceDe(cuerpo) {
  const salida = [];
  let dentroDeCodigo = false;
  for (const l of String(cuerpo || '').split('\n')) {
    if (/^```/.test(l)) { dentroDeCodigo = !dentroDeCodigo; continue; }
    if (dentroDeCodigo) continue;
    if (/^##\s/.test(l) && !/^###/.test(l)) {
      const txt = l.slice(3).trim();
      salida.push({ id: anclaDe(txt), txt: txt.replace(/`/g, '') });
    }
  }
  return salida;
}

function md(txt) {
  if (!txt) return '';
  const ls = txt.split('\n');
  let out = '', i = 0;

  const cierra = (buf, tag) => buf.length ? `<${tag}>${buf.join('')}</${tag}>` : '';

  while (i < ls.length) {
    const l = ls[i];

    if (/^```/.test(l)) {
      // ```lenguaje|estado|Titulo   (estado: mal | bien | neutro)
      const cab = l.slice(3).trim().split('|');
      const estado = (cab[1] || '').trim();
      const rotulo = (cab[2] || '').trim();
      const cuerpo = [];
      i++;
      while (i < ls.length && !/^```/.test(ls[i])) { cuerpo.push(ls[i]); i++; }
      i++;
      out += bloqueCodigo((cab[0] || '').trim(), estado, rotulo, cuerpo.join('\n'));
      continue;
    }
    if (/^####\s/.test(l)) { out += '<h4>' + linea(l.slice(5)) + '</h4>'; i++; continue; }
    if (/^###\s/.test(l)) { out += '<h4>' + linea(l.slice(4)) + '</h4>'; i++; continue; }
    if (/^##\s/.test(l)) {
      const txt = l.slice(3);
      out += '<h3 id="' + anclaDe(txt) + '">' + linea(txt) + '</h3>';
      i++; continue;
    }
    if (/^\|/.test(l)) {
      const filas = [];
      while (i < ls.length && /^\|/.test(ls[i])) {
        const celdas = ls[i].replace(/^\|/, '').replace(/\|$/, '').split('|');
        if (!celdas.every(c => /^[-: ]*$/.test(c))) filas.push(celdas);
        i++;
      }
      if (filas.length) {
        out += '<table><thead><tr>' + filas[0].map(c => '<th>' + linea(c.trim()) + '</th>').join('') +
          '</tr></thead><tbody>' +
          filas.slice(1).map(f => '<tr>' + f.map(c => '<td>' + linea(c.trim()) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>';
      }
      continue;
    }
    if (/^:::/.test(l)) {
      const cab = l.slice(3).trim();
      const esp = cab.indexOf(' ');
      const tipo = (esp === -1 ? cab : cab.slice(0, esp)).toLowerCase() || 'nota';
      const titulo = esp === -1 ? '' : cab.slice(esp + 1).trim();
      const cuerpo = [];
      i++;
      while (i < ls.length && !/^:::\s*$/.test(ls[i])) { cuerpo.push(ls[i]); i++; }
      i++;
      const tipos = ['aviso', 'error', 'clave', 'analogia', 'pro', 'nota'];
      const cl = tipos.includes(tipo) ? tipo : 'nota';
      out += '<aside class="caja caja-' + cl + '">' +
        (titulo ? '<h5 class="caja-tit">' + linea(titulo) + '</h5>' : '') +
        md(cuerpo.join('\n')) + '</aside>';
      continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < ls.length && /^>\s?/.test(ls[i])) { buf.push(ls[i].replace(/^>\s?/, '')); i++; }
      out += '<blockquote>' + md(buf.join('\n')) + '</blockquote>';
      continue;
    }
    if (/^[-*]\s/.test(l)) {
      const buf = [];
      while (i < ls.length && (/^[-*]\s/.test(ls[i]) || (/^\s{2,}\S/.test(ls[i]) && buf.length))) {
        if (/^[-*]\s/.test(ls[i])) buf.push('<li>' + linea(ls[i].slice(2)));
        else buf[buf.length - 1] += ' ' + linea(ls[i].trim());
        i++;
      }
      out += cierra(buf.map(x => x + '</li>'), 'ul');
      continue;
    }
    if (/^\d+\.\s/.test(l)) {
      const buf = [];
      while (i < ls.length && (/^\d+\.\s/.test(ls[i]) || (/^\s{3,}\S/.test(ls[i]) && buf.length))) {
        if (/^\d+\.\s/.test(ls[i])) buf.push('<li>' + linea(ls[i].replace(/^\d+\.\s/, '')));
        else buf[buf.length - 1] += ' ' + linea(ls[i].trim());
        i++;
      }
      out += cierra(buf.map(x => x + '</li>'), 'ol');
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < ls.length && ls[i].trim() && !/^(```|#{2,4}\s|\||>|[-*]\s|\d+\.\s)/.test(ls[i])) {
      buf.push(ls[i].trim()); i++;
    }
    out += '<p>' + linea(buf.join(' ')) + '</p>';
  }
  return out;
}

/* ---------- Almacenamiento en tres capas ---------- */

const CLAVE = 'lm.dam.v1';
const CLAVE_NUBE = 'lm-dam-progreso';

function molde() {
  return { v: 1, alumno: '', ej: {}, q: {}, ts: 0 };
}

function sanea(x) {
  const m = molde();
  if (!x || typeof x !== 'object') return m;
  m.alumno = typeof x.alumno === 'string' ? x.alumno.slice(0, 60) : '';
  m.ts = typeof x.ts === 'number' ? x.ts : 0;
  if (x.ej && typeof x.ej === 'object') {
    for (const k of Object.keys(x.ej).slice(0, 4000)) {
      const e = x.ej[k];
      if (!e || typeof e !== 'object') continue;
      m.ej[k] = { h: !!e.h, sol: !!e.sol, t: typeof e.t === 'number' ? e.t : 0 };
    }
  }
  if (x.q && typeof x.q === 'object') {
    for (const k of Object.keys(x.q).slice(0, 4000)) {
      const q = x.q[k];
      if (!q || typeof q !== 'object') continue;
      m.q[k] = { ok: !!q.ok, op: typeof q.op === 'number' ? q.op : -1 };
    }
  }
  return m;
}

function guardaLocal() {
  APP.estado.ts = Date.now();
  try {
    const prev = localStorage.getItem(CLAVE);
    if (prev) localStorage.setItem(CLAVE + '.prev', prev);
    localStorage.setItem(CLAVE, JSON.stringify(APP.estado));
  } catch (e) {
    tosta('No se ha podido guardar en este navegador. Exporta tu progreso.', true);
  }
}

async function guardaNube() {
  if (!window.storage || !window.storage.set) return;
  for (let i = 0; i < 3; i++) {
    try {
      await window.storage.set(CLAVE_NUBE, JSON.stringify(APP.estado), false);
      return true;
    } catch (e) {
      await new Promise(r => setTimeout(r, 400 * Math.pow(2, i)));
    }
  }
  return false;
}

let temporizadorNube = null;
function guarda() {
  guardaLocal();
  clearTimeout(temporizadorNube);
  temporizadorNube = setTimeout(() => { guardaNube(); }, 1500);
}

async function carga() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(CLAVE) || 'null'); } catch (e) { }
  let nube = null;
  if (window.storage && window.storage.get) {
    try {
      const r = await window.storage.get(CLAVE_NUBE, false);
      if (r && r.value) nube = JSON.parse(r.value);
    } catch (e) { }
  }
  const a = sanea(local), b = sanea(nube);
  APP.estado = (b.ts > a.ts) ? b : a;
}

function tosta(txt, mal) {
  const d = document.createElement('div');
  d.className = 'tost' + (mal ? ' mal' : '');
  d.textContent = txt;
  document.getElementById('tostadas').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

/* ---------- Verificador ---------- */

const SIN_ETIQUETA = ['hidden', 'submit', 'button', 'reset', 'image'];

function limpiaDoc(doc) {
  doc.querySelectorAll('script,iframe,object,embed,link,base,meta[http-equiv]').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      if (a.name === 'href' && /^javascript:/i.test(a.value)) n.removeAttribute(a.name);
    });
  });
}

function alcanceCss(css, pref) {
  css = css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/@import[^;]*;/gi, '');
  let out = '', i = 0;
  while (i < css.length) {
    const abre = css.indexOf('{', i);
    if (abre === -1) break;
    const sel = css.slice(i, abre).trim();
    if (/^@(media|supports|layer|container)/i.test(sel)) {
      let n = 1, j = abre + 1;
      while (j < css.length && n > 0) { if (css[j] === '{') n++; if (css[j] === '}') n--; j++; }
      out += sel + '{' + alcanceCss(css.slice(abre + 1, j - 1), pref) + '}';
      i = j;
      continue;
    }
    let n = 1, j = abre + 1;
    while (j < css.length && n > 0) { if (css[j] === '{') n++; if (css[j] === '}') n--; j++; }
    const cuerpo = css.slice(abre + 1, j - 1);
    if (/^@/.test(sel)) out += sel + '{' + cuerpo + '}';
    else {
      const sels = sel.split(',').map(s => {
        s = s.trim();
        if (!s) return '';
        if (/^(html|body|:root)\b/i.test(s)) return pref + s.replace(/^(html|body|:root)/i, '');
        return pref + ' ' + s;
      }).filter(Boolean).join(',');
      if (sels) out += sels + '{' + cuerpo + '}';
    }
    i = j;
  }
  return out;
}

function lum(c) {
  const m = c.match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const p = m[1].split(',').map(x => parseFloat(x));
  if (p.length > 3 && p[3] === 0) return null;
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(p[0]) + 0.7152 * f(p[1]) + 0.0722 * f(p[2]);
}

function fondoReal(el, tope) {
  let n = el;
  while (n && n !== tope.parentNode) {
    const c = getComputedStyle(n).backgroundColor;
    const l = lum(c);
    if (l !== null) return l;
    n = n.parentElement;
  }
  return 1;
}

function cuenta(doc, sel) {
  try { return doc.querySelectorAll(sel).length; } catch (e) { return -1; }
}

async function inflaBase64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const flujo = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return await new Response(flujo).text();
}

function verifica(html, css, checks, js) {
  js = js || '';
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const hojas = [...doc.querySelectorAll('link[rel~="stylesheet" i]')]
    .map(x => ({ href: x.getAttribute('href') || '', enCabeza: !!x.closest('head') }));
  const guiones = [...doc.querySelectorAll('script')].map(x => ({
    src: x.getAttribute('src') || '',
    defer: x.hasAttribute('defer') || x.hasAttribute('async'),
    enCabeza: !!x.closest('head'),
    cuerpo: (x.textContent || '').trim()
  }));
  const manejadores = [...doc.querySelectorAll('*')]
    .filter(e => [...e.attributes].some(x => /^on/i.test(x.name))).length;
  limpiaDoc(doc);
  const res = [];
  const VISUALES = ['ancho390', 'contraste', 'computa', 'anchoen'];
  const necesitaPintar = checks.some(c => VISUALES.includes(c[0]));
  let caja = null;

  if (necesitaPintar) {
    const l = document.getElementById('lienzo');
    l.innerHTML = '';
    caja = document.createElement('div');
    caja.id = 'lienzoCaja';
    const anchoLienzo = (checks.find(c => c[0] === 'anchoen') || [])[1] || '390';
    caja.style.cssText = 'width:' + (+anchoLienzo || 390) + 'px';
    const base = document.createElement('style');
    base.textContent = '#lienzoCaja{background:#fff;color:#000;'
      + 'font-family:serif;font-size:16px;line-height:normal}';
    caja.appendChild(base);
    if (css.trim()) {
      const st = document.createElement('style');
      st.textContent = alcanceCss(css, '#lienzoCaja');
      caja.appendChild(st);
    }
    const env = document.createElement('div');
    env.innerHTML = doc.body ? doc.body.innerHTML : html;
    caja.appendChild(env);
    l.appendChild(caja);
  }

  for (const c of checks) {
    const t = c[0];
    if (t === 'doctype')
      res.push(r(!!doc.doctype, 'Declaración `<!DOCTYPE html>`',
        doc.doctype ? '' : 'No aparece, o no es la primera línea del documento'));
    else if (t === 'lang') {
      const v = doc.documentElement && doc.documentElement.getAttribute('lang');
      res.push(r(!!v, 'Idioma declarado en `<html lang>`', v ? 'lang="' + v + '"' : 'Falta el atributo lang'));
    }
    else if (t === 'charset') {
      const m = doc.querySelector('meta[charset]');
      res.push(r(!!m, 'Codificación declarada', m ? '' : 'Falta <meta charset="UTF-8">'));
    }
    else if (t === 'viewport') {
      const m = doc.querySelector('meta[name="viewport"]');
      const ok = m && /width\s*=\s*device-width/i.test(m.getAttribute('content') || '');
      res.push(r(!!ok, 'Etiqueta viewport para móviles',
        m ? (ok ? '' : 'Falta width=device-width en el content') : 'Falta la etiqueta viewport'));
    }
    else if (t === 'title') {
      const ti = (doc.title || '').trim();
      res.push(r(!!ti, 'Título de la pestaña', ti ? '«' + ti + '»' : 'Falta el <title> o está vacío'));
    }
    else if (t === 'sel') {
      const sel = c[1], min = +(c[2] || 1), max = c[3] ? +c[3] : Infinity;
      const n = cuenta(doc, sel);
      if (n < 0) { res.push(r(false, 'Selector `' + sel + '`', 'Selector no válido')); continue; }
      const ok = n >= min && n <= max;
      const esperado = max === Infinity ? ('al menos ' + min) : (min === max ? ('exactamente ' + min) : (min + ' a ' + max));
      res.push(r(ok, 'Elementos que encajan con `' + sel + '`', 'Encontrados ' + n + ', se esperaban ' + esperado));
    }
    else if (t === 'attr') {
      const els = [...doc.querySelectorAll(c[1])];
      const mal = els.filter(e => !(e.getAttribute(c[2]) || '').trim());
      if (!els.length) res.push(d('No hay elementos `' + c[1] + '` que comprobar', 'Ninguno encontrado'));
      else res.push(r(!mal.length, 'Todos los `' + c[1] + '` tienen `' + c[2] + '`',
        mal.length ? mal.length + ' sin ' + c[2] : els.length + ' comprobados'));
    }
    else if (t === 'texto') {
      const els = [...doc.querySelectorAll(c[1])];
      const ok = els.some(e => (e.textContent || '').toLowerCase().includes(c[2].toLowerCase()));
      res.push(r(ok, 'En `' + c[1] + '` aparece «' + c[2] + '»', ok ? '' : 'No se encuentra ese texto'));
    }
    else if (t === 'alt') {
      const imgs = [...doc.querySelectorAll('img')];
      const sin = imgs.filter(i => !i.hasAttribute('alt'));
      const vacios = imgs.filter(i => i.hasAttribute('alt') && !i.getAttribute('alt').trim());
      if (!imgs.length) res.push(d('No hay imágenes que comprobar', ''));
      else res.push(r(!sin.length, 'Todas las imágenes tienen `alt`',
        sin.length ? sin.length + ' sin alt' : imgs.length + ' imágenes, ' + vacios.length + ' con alt vacío (decorativas)'));
    }
    else if (t === 'labels') {
      const ctr = [...doc.querySelectorAll('input,select,textarea')]
        .filter(e => !SIN_ETIQUETA.includes((e.getAttribute('type') || '').toLowerCase()));
      const mal = ctr.filter(e => {
        if (e.closest('label')) return false;
        const id = e.getAttribute('id');
        if (id && doc.querySelector('label[for="' + CSS.escape(id) + '"]')) return false;
        if ((e.getAttribute('aria-label') || '').trim()) return false;
        return true;
      });
      if (!ctr.length) res.push(d('Etiquetas de los campos', 'No hay campos de formulario en esta pagina'));
      else res.push(r(!mal.length, 'Todos los campos tienen etiqueta',
        mal.length ? mal.length + ' campo(s) sin <label>: ' + mal.map(e => e.getAttribute('name') || e.tagName.toLowerCase()).join(', ')
          : ctr.length + ' campos comprobados'));
    }
    else if (t === 'nombres') {
      const ctr = [...doc.querySelectorAll('input,select,textarea')]
        .filter(e => !['submit', 'button', 'reset', 'image'].includes((e.getAttribute('type') || '').toLowerCase()));
      const mal = ctr.filter(e => !(e.getAttribute('name') || '').trim());
      if (!ctr.length) res.push(d('Atributo `name` de los campos', 'No hay campos de formulario en esta pagina'));
      else res.push(r(!mal.length, 'Todos los campos tienen `name`',
        mal.length ? mal.length + ' sin name: el dato no llegaría al servidor' : ctr.length + ' campos comprobados'));
    }
    else if (t === 'orden') {
      const hs = [...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(h => +h.tagName[1]);
      const h1 = hs.filter(x => x === 1).length;
      let salto = null;
      for (let k = 1; k < hs.length; k++) if (hs[k] > hs[k - 1] + 1) { salto = 'h' + hs[k - 1] + ' → h' + hs[k]; break; }
      const ok = h1 === 1 && !salto;
      res.push(r(ok, 'Jerarquía de encabezados',
        ok ? hs.length + ' encabezados, sin saltos'
          : (h1 !== 1 ? 'Hay ' + h1 + ' elementos h1, debe haber uno' : 'Salto de nivel: ' + salto)));
    }
    else if (t === 'noinline') {
      const n = doc.querySelectorAll('[style]').length;
      res.push(r(n === 0, 'Sin atributos `style`', n ? n + ' elemento(s) con style' : ''));
    }
    else if (t === 'noobs') {
      const obs = [...doc.querySelectorAll('font,center,marquee,big,strike,tt,blink,frame,frameset')];
      const pres = [...doc.querySelectorAll('[bgcolor],[align],[border]:not(table):not(img)')];
      const total = obs.length + pres.length;
      res.push(r(total === 0, 'Sin etiquetas ni atributos de presentación',
        total ? obs.map(e => '<' + e.tagName.toLowerCase() + '>').join(' ') + ' ' + (pres.length ? pres.length + ' atributo(s)' : '') : ''));
    }
    else if (t === 'unicoid') {
      const ids = [...doc.querySelectorAll('[id]')].map(e => e.getAttribute('id'));
      const rep = ids.filter((x, k) => ids.indexOf(x) !== k);
      res.push(r(!rep.length, 'Ningún `id` repetido', rep.length ? 'Repetidos: ' + [...new Set(rep)].join(', ') : ids.length + ' id comprobados'));
    }
    else if (t === 'anida') {
      const fallos = [];
      doc.querySelectorAll('ul,ol').forEach(l => {
        [...l.children].forEach(h => {
          if (!['LI', 'SCRIPT', 'TEMPLATE'].includes(h.tagName))
            fallos.push('<' + h.tagName.toLowerCase() + '> como hijo directo de <' + l.tagName.toLowerCase() + '>');
        });
      });
      doc.querySelectorAll('li').forEach(li => {
        if (!li.parentElement || !['UL', 'OL', 'MENU'].includes(li.parentElement.tagName))
          fallos.push('<li> fuera de una lista');
      });
      doc.querySelectorAll('dt,dd').forEach(e => {
        if (!e.closest('dl')) fallos.push('<' + e.tagName.toLowerCase() + '> fuera de <dl>');
      });
      doc.querySelectorAll('p').forEach(p => {
        if (p.querySelector('div,p,ul,ol,table,section,article'))
          fallos.push('bloque dentro de un <p>');
      });
      doc.querySelectorAll('a a').forEach(() => fallos.push('<a> dentro de otro <a>'));
      const u = [...new Set(fallos)];
      res.push(r(!u.length, 'Anidamiento válido', u.length ? u.slice(0, 4).join(' · ') : ''));
    }
    else if (t === 'ancho390' && caja) {
      const desb = [];
      caja.querySelectorAll('*').forEach(e => {
        const rc = e.getBoundingClientRect();
        const rb = caja.getBoundingClientRect();
        if (rc.width > 0 && rc.right > rb.left + 391.5) desb.push(e.tagName.toLowerCase());
      });
      const ok = caja.scrollWidth <= 391 && !desb.length;
      res.push(r(ok, 'Sin desbordamiento horizontal a 390 px',
        ok ? '' : 'Ancho real ' + caja.scrollWidth + ' px' + (desb.length ? ' · se sale: ' + [...new Set(desb)].slice(0, 4).join(', ') : '')));
    }

      const emb = guiones.filter(g => !g.src && g.cuerpo).length;

      if (emb) p.push(emb + ' bloque(s) <script> con codigo dentro del HTML');

  }
  if (caja) document.getElementById('lienzo').innerHTML = '';
  return res;

  function r(ok, titulo, detalle) { return { e: ok ? 'si' : 'no', titulo, detalle }; }

}

function hesc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    }

function resaltaHTML(c) {

function resaltaJSON(c) {

function resalta(code, lang) {

function hashC(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const NO_RUN = new Set(["1khenhz", "3nxmxq", "1wmcntb", "1ozl2pl", "15afqxn", "1c9ml4k", "iq203l", "ci9ftv", "11lxldy", "2biy3l", "18r7fhl"]);

'use strict';

function especificidad(sel) {
  let s = ' ' + sel.replace(/\s*([>+~])\s*/g, ' ').trim(); let a = 0, b = 0, c = 0;
  s = s.replace(/:(not|is|has)\(([^()]*)\)/g, (m, f, arg) => { const sp = arg.split(',').map(especificidad).sort((x, y) => y[0] - x[0] || y[1] - x[1] || y[2] - x[2])[0]; a += sp[0]; b += sp[1]; c += sp[2]; return ''; });
  s = s.replace(/:where\([^()]*\)/g, '');
  const cuenta = rx => { const n = (s.match(rx) || []).length; s = s.replace(rx, ''); return n; };
  a += cuenta(/#[\w-]+/g); b += cuenta(/\.[\w-]+/g); b += cuenta(/\[[^\]]*\]/g); c += cuenta(/::[\w-]+/g); b += cuenta(/:[\w-]+(\([^)]*\))?/g);
  c += (s.match(/(^|\s)[a-zA-Z][\w-]*/g) || []).length;
  return [a, b, c];
}
const cmpEsp = (x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2];

function lumHex(h) { const n = parseInt(h.slice(1), 16); const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255); }
function ratio(a, b) { const x = lumHex(a), y = lumHex(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
function hslHex(h, s, l) { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l); const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))); return '#' + [f(0), f(8), f(4)].map(x => x.toString(16).padStart(2, '0')).join(''); }

    const rl = rango(c, { l: 'Luminosidad (L)', min: 0, max: 100, v: st.l, f: v => v + '%', on: v => { st.l = v; pinta(); } });
    const c2 = fila(el, 'Fondo'); pills(c2, [{ l: 'Blanco', v: '#ffffff' }, { l: 'Gris claro', v: '#eef1f5' }, { l: 'Amarillo', v: '#fff3cd' }, { l: 'Azul oscuro', v: '#14213d' }, { l: 'Negro', v: '#000000' }], it => { st.bg = it.v; pinta(); }, 0);

  d: 'Imagina que este texto lo ha escrito un usuario en un formulario. Mira qué pasa al meterlo en la página de cada forma. (Aquí no se ejecuta nada de verdad).',
  mount(el) {
    const EJ = ['Ana García', '<b>Ana</b>', '<img src="x" onerror="alert(document.cookie)">', '<script>robarSesion()<\/script>', '<a href="https://falso.com">Pulsa aquí para ganar</a>'];
    const c = fila(el, 'El usuario escribe'); pills(c, ['Normal', 'Con negrita', 'Imagen trampa', 'Script', 'Enlace falso'], (it, i) => { inp.value = EJ[i]; pinta(); }, 2);
    const inp = H('input', { class: 'txt', value: EJ[2], spellcheck: 'false', 'aria-label': 'Texto del usuario' }); el.appendChild(inp);
    const tri = add(el, `<div class="xss"><div class="xss-c mal"><span class="lab">saludo.innerHTML = 'Hola, ' + nombre</span><div class="xss-r"></div><div class="xss-e"></div></div>
      <div class="xss-c"><span class="lab">saludo.textContent = 'Hola, ' + nombre</span><div class="xss-r"></div><div class="xss-e"></div></div>
      <div class="xss-c"><span class="lab">\`Hola, \${escapa(nombre)}\` en una plantilla</span><div class="xss-r"></div><div class="xss-e"></div></div></div>`);
    const msg = mensaje(el); inp.addEventListener('input', pinta);
    const escapa = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    function pinta() {
      const v = inp.value; const [a, b, cc] = tri.querySelectorAll('.xss-c');
      const doc = new DOMParser().parseFromString('<div>Hola, ' + v + '</div>', 'text/html'); const root = doc.body.firstChild;
      const peligros = []; root.querySelectorAll('*').forEach(n => { [...n.attributes].forEach(at => { if (/^on/i.test(at.name)) { peligros.push(`<code>${hesc(at.name)}</code> ejecutaría <code>${hesc(at.value)}</code>`); n.removeAttribute(at.name); } }); if (n.tagName === 'SCRIPT') { n.remove(); } if (n.tagName === 'A') n.setAttribute('href', '#'); if (n.tagName === 'IMG') { n.removeAttribute('src'); n.setAttribute('alt', '[imagen]'); } });
      const hayScript = /<script/i.test(v); const nEl = doc.body.firstChild.querySelectorAll('*').length + (hayScript ? 1 : 0);
      a.querySelector('.xss-r').innerHTML = root.innerHTML;
      a.querySelector('.xss-e').innerHTML = peligros.length ? '<b class="rojo">¡Peligro!</b> ' + peligros.join('; ') + '. El atacante podría robar la sesión de quien vea esta página.' : hayScript ? 'Se crea el <code>&lt;script&gt;</code> pero <b>no se ejecuta</b> por innerHTML… aunque con una imagen trampa sí. No te fíes.' : nEl ? `El texto del usuario se ha convertido en <b>${nEl} elemento${nEl > 1 ? 's' : ''} HTML</b>.` : 'Sin etiquetas, se ve bien… esta vez.';
      a.classList.toggle('mal', !!(peligros.length || nEl));
      b.querySelector('.xss-r').textContent = 'Hola, ' + v; b.querySelector('.xss-e').innerHTML = 'Se muestra <b>literalmente</b>. Nada se interpreta como HTML. Es lo que debes usar para texto.';
      cc.querySelector('.xss-r').innerHTML = 'Hola, ' + escapa(v); cc.querySelector('.xss-e').innerHTML = 'Lo que se inserta: <code>' + hesc(escapa(v)).slice(0, 90) + '</code>. Si generas marcado con plantillas, <b>escapa cada dato</b>.';
      msg(peligros.length || nEl ? 'Regla del curso: <b>nunca metas con innerHTML algo que venga del usuario o de una API</b> sin escaparlo. Para texto, <code>textContent</code>.' : 'Prueba con los ejemplos peligrosos de arriba.', peligros.length ? 'mal' : 'av');
    }

/* ---------- Eventos: propagación y delegación ---------- */
defSim('eventos', {
  t: 'Captura, objetivo y burbuja', b: '4',
  d: 'Haz clic en cualquier parte de la lista. El evento recorre el árbol hacia abajo (captura) y vuelve hacia arriba (burbuja). Cada manejador que lo recibe se ilumina en orden.',
  mount(el, modo) {
    let deleg = modo === 'delegacion', captura = false, stop = false, n = 3;
    const c = fila(el); pills(c, ['Un manejador en cada nivel', 'Delegación: un solo manejador en la lista'], (it, i) => { deleg = i === 1; monta(); }, deleg ? 1 : 0);
    const c2 = fila(el);
    const kc = casilla(c2, 'Escuchar también en fase de captura', false, v => { captura = v; });
    const ks = casilla(c2, '<code>e.stopPropagation()</code> en el <code>li</code>', false, v => { stop = v; });
    const dos = add(el, '<div class="dos"><div class="ev-demo"></div><div class="consola mono ev-log"></div></div>');
    const demo = dos.querySelector('.ev-demo'), log = dos.querySelector('.ev-log');
    const c3 = fila(el); const addB = boton(c3, 'Añadir una tarea nueva', () => { n++; const ul = demo.querySelector('ul'); ul.insertAdjacentHTML('beforeend', li(n)); if (!deleg) engancha(ul.lastElementChild); msg(deleg ? 'Tarea añadida. <b>No has tenido que añadir ningún manejador</b>: la lista ya escucha los clics de todos sus hijos, también los que crees después.' : 'Tarea añadida y le hemos puesto sus propios manejadores. Con delegación no haría falta.', 'ok'); }, 'sec sm');
    const msg = mensaje(el);
    const li = i => `<li class="ev-n" data-n="li"><span>Tarea ${i}</span><button type="button" class="ev-n ev-bor" data-n="button">Borrar</button></li>`;
    let cola = [];
    function monta() {
      demo.innerHTML = `<section class="ev-n" data-n="section"><span class="ev-et">section</span><ul class="ev-n" data-n="ul"><span class="ev-et">ul</span>${[1, 2, 3].map(li).join('')}</ul></section>`; n = 3; log.innerHTML = '<span class="muted">Haz clic en la lista…</span>';
      kc.closest('label').style.display = ks.closest('label').style.display = deleg ? 'none' : '';
      if (deleg) {
        demo.querySelector('ul').addEventListener('click', e => {
          const btn = e.target.closest('.ev-bor'); const l = e.target.closest('li');
          log.innerHTML = `<div>ul recibe el clic</div><div>· e.target = <b>${e.target.tagName.toLowerCase()}</b></div><div>· e.currentTarget = <b>ul</b></div>`;
          if (btn) { log.innerHTML += `<div>· e.target.closest('.borrar') → button → <b>borrar su li</b></div>`; l.classList.add('fuera'); later(() => l.remove(), 300); }
          else if (l) { l.classList.toggle('hecha'); log.innerHTML += `<div>· e.target.closest('li') → <b>marcar como hecha</b></div>`; }
          else log.innerHTML += '<div>· no es un li ni un botón: no se hace nada</div>';
          msg('Un único manejador en el <code>ul</code>. Con <code>e.target.closest()</code> averigua en qué se pulsó. Funciona con 3 tareas o con 3000.', 'ok');
        });
        msg('Delegación: pulsa una tarea para marcarla o «Borrar» para quitarla. Luego añade tareas nuevas.');
      } else { engancha(demo.querySelector('section')); msg('Pulsa el botón «Borrar» de una tarea.'); }
    }
    function engancha(nodo) {
      const nodos = nodo.matches('.ev-n') ? [nodo, ...nodo.querySelectorAll('.ev-n')] : [...nodo.querySelectorAll('.ev-n')];
      nodos.forEach(nd => {
        nd.addEventListener('click', e => { if (captura) cola.push({ nd, f: 'captura', t: e.target }); }, true);
        nd.addEventListener('click', e => { cola.push({ nd, f: e.eventPhase === 2 ? 'objetivo' : 'burbuja', t: e.target }); if (stop && nd.dataset.n === 'li') { cola.push({ nd, f: 'stop', t: e.target }); e.stopPropagation(); } });
      });
    }
    demo.addEventListener('click', () => {
      if (deleg) return;
      later(() => { const pasos = cola; cola = []; if (!pasos.length) return; log.innerHTML = ''; demo.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
        pasos.forEach((p, k) => later(() => {
          demo.querySelectorAll('.on').forEach(x => x.classList.remove('on')); p.nd.classList.add('on');
          if (p.f === 'stop') { log.insertAdjacentHTML('beforeend', `<div class="warn">stopPropagation(): aquí se corta la burbuja</div>`); return; }
          log.insertAdjacentHTML('beforeend', `<div><span class="ev-f ${p.f}">${p.f}</span> ${p.nd.dataset.n} · target=<b>${p.t.tagName.toLowerCase()}</b> · currentTarget=<b>${p.nd.dataset.n}</b></div>`);
          if (k === pasos.length - 1) { later(() => p.nd.classList.remove('on'), 500); msg(`El clic lo recibieron <b>${pasos.filter(x => x.f !== 'stop').length} manejadores</b>. <code>e.target</code> es siempre lo que pulsaste; <code>e.currentTarget</code>, el elemento cuyo manejador se está ejecutando.${stop ? ' Con stopPropagation la burbuja no llega a ul ni a section.' : ''}`, 'ok'); }
        }, k * 380));
      }, 0);
    }, true);
    monta();
  }
});

let TOC_OBS = null;

  lista.innerHTML = items.map(([id, t]) => `<li><a href="#${id}" data-salta="${id}">${esc(t)}</a></li>`).join('');
  if (TOC_OBS) TOC_OBS.disconnect();
  const vis = new Map();
  TOC_OBS = new IntersectionObserver(es => {
    es.forEach(e => vis.set(e.target.id, e.isIntersecting ? e.boundingClientRect.top : null));
    let mejor = null; for (const [id, , el] of items) { const r = el.getBoundingClientRect(); if (r.top < window.innerHeight * .35) mejor = id; }

}

/* ---------- progreso ---------- */
function vistaProgreso() {
  const totalEj = APP.sesiones.reduce((a, s) => a + s.ejercicios.length, 0);
  const hechos = APP.sesiones.reduce((a, s) => a + nHechos(s), 0), soluciones = Object.values(APP.estado.ej).filter(e => e.sol).length;
  const qs = Object.values(APP.estado.q), aciertos = qs.filter(q => q.ok).length;
  let h = `<header class="hero"><div class="eyebrow">Mi progreso</div><h1>Tu recorrido por el curso</h1><p class="lead">Esto es tuyo y se guarda en este navegador. No lo ve nadie más. Si cambias de ordenador, expórtalo y vuelve a importarlo.</p></header>
  <div style="max-width:980px"><label class="campo" style="max-width:420px"><span>Tu nombre</span><input type="text" id="nombre" value="${esc(APP.estado.alumno)}" placeholder="Para tus copias de seguridad"></label>
  <div class="rejilla" style="margin-top:18px">
    <div class="card medidor"><h3>Ejercicios</h3><div class="barra"><i style="width:${totalEj ? hechos / totalEj * 100 : 0}%"></i></div><p class="cifra">${hechos} de ${totalEj}</p></div>
    <div class="card medidor"><h3>Autoevaluación</h3><div class="barra"><i style="width:${qs.length ? aciertos / qs.length * 100 : 0}%"></i></div><p class="cifra">${aciertos} de ${qs.length} contestadas bien</p></div>
    <div class="card medidor"><h3>Soluciones abiertas</h3><p style="font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--ink)">${soluciones}</p><p class="cifra">De ${hechos} ejercicios marcados</p></div></div>
  <div class="bloqueh"><h2>Por bloque</h2></div><div class="grid-b">`;
  for (const bId of Object.keys(APP.bloques)) {
    const ses = APP.sesiones.filter(x => x.bloque === bId); const t = ses.reduce((a, s) => a + s.ejercicios.length, 0), hh = ses.reduce((a, s) => a + nHechos(s), 0);
    h += `<div class="card" data-b="${bId}" style="display:flex;gap:14px;align-items:center"><div class="anillo" style="--p:${t ? Math.round(hh / t * 100) : 0}"><span>${t ? Math.round(hh / t * 100) : 0}%</span></div><div><b>${esc(APP.bloques[bId].t)}</b><p class="cifra">${hh} de ${t} ejercicios</p></div></div>`;
  }
  h += `</div><div class="bloqueh"><h2>Por sesión</h2></div><div class="lista">`;
  for (const s of APP.sesiones) {
    const qk = Object.keys(APP.estado.q).filter(x => x.startsWith(s.id + ':')), qa = qk.filter(x => APP.estado.q[x].ok).length;
    const carr = s.ejercicios.map((e, i) => hechoEj(idsEj(s, i)) ? e.carril : '·').join(' ');
    h += `<button class="fila${sesionCompleta(s) ? ' hecha' : ''}" data-ir="sesion" data-id="${s.id}" data-b="${s.bloque}" type="button"><span class="id">${s.id}</span><span class="tt">${esc(s.titulo)}<small>Carriles: ${carr}${qk.length ? ' · preguntas ' + qa + '/' + qk.length : ''}</small></span><span class="pr"><span class="dots">${s.ejercicios.map((_, i) => `<i class="${hechoEj(idsEj(s, i)) ? 'si' : ''}"></i>`).join('')}</span></span></button>`;
  }
  h += `</div><div class="bloqueh"><h2>Copia de seguridad</h2></div><p>El navegador puede borrar sus datos si se limpia el historial o si usas el modo incógnito. Exporta de vez en cuando: es la única copia que no depende de nadie.</p>
  <div class="acciones" style="border:0"><button class="b" data-acc="exportar" type="button">Exportar a un archivo</button><button class="b sec" data-acc="importar" type="button">Importar desde un archivo</button><button class="b sec" data-acc="borrar" type="button">Borrar mi progreso</button></div><div data-zona="borrado"></div>
  <p class="sello">Versión ${esc(APP.sello)} · ${APP.sesiones.length} sesiones · ${APP.conceptos.length} fichas de referencia · ${Object.keys(SIMS).length} simuladores · almacenamiento local ${localDisponible() ? 'disponible' : 'NO disponible'}${window.storage ? ' · copia en la nube disponible' : ''}</p></div>`;
  return h;
}
function localDisponible() { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } }

/* ---------- pintado ---------- */

/* ---------- paleta de búsqueda ---------- */
let PAL = { sel: 0, items: [] };
function abrePaleta() {
  const p = $('#paleta'); p.hidden = false; const i = $('#palIn'); i.value = ''; filtraPaleta(''); setTimeout(() => i.focus(), 10);
}
function cierraPaleta() { $('#paleta').hidden = true; }
function filtraPaleta(q) {
  const n = normaliza(q.trim()); const res = [];
  const pun = (t, extra) => { if (!n) return 1; const a = normaliza(t); if (a.startsWith(n)) return 3; if (a.includes(n)) return 2; if (extra && normaliza(extra).includes(n)) return 1; return 0; };
  APP.sesiones.forEach(s => { const p = pun(s.id + ' ' + s.titulo, s.objetivo); if (p) res.push({ g: 'Sesiones', k: s.id, t: s.titulo, d: s.objetivo, p: p + (n ? 0 : -1), ir: ['sesion', s.id], b: s.bloque }); });
  APP.conceptos.forEach(c => { const p = pun(c.titulo, c.tema + ' ' + (n.length > 2 ? c.cuerpo : '')); if (p) res.push({ g: 'Referencia', k: '§', t: c.titulo, d: c.tema, p, ir: ['concepto', c.id], b: bloqueDeFicha(c.id) }); });
  Object.values(SIMS).forEach(x => { const p = pun(x.t, x.d); if (p) res.push({ g: 'Laboratorio', k: 'Lab', t: x.t, d: x.d.slice(0, 90) + '…', p, ir: ['labsim', x.id], b: x.b }); });
  const orden = ['Sesiones', 'Referencia', 'Laboratorio'];
  const porG = orden.map(g => res.filter(r => r.g === g).sort((a, b) => b.p - a.p).slice(0, n ? 8 : 5));
  PAL.items = porG.flat(); PAL.sel = 0;
  let h = ''; let k = 0;
  porG.forEach((arr, gi) => { if (!arr.length) return; h += `<div class="gr">${orden[gi]}</div>`; arr.forEach(r => { h += `<button class="it${k === 0 ? ' sel' : ''}" data-pi="${k}" data-b="${r.b}" type="button"><span class="k">${esc(r.k)}</span><span>${esc(r.t)}<small>${esc(r.d)}</small></span></button>`; k++; }); });
  $('#palRes').innerHTML = h || '<p class="muted" style="padding:14px">Nada con esas palabras.</p>';
}
function mueveSel(d) { if (!PAL.items.length) return; PAL.sel = (PAL.sel + d + PAL.items.length) % PAL.items.length; $$('#palRes .it').forEach((e, i) => e.classList.toggle('sel', i === PAL.sel)); const e = $(`#palRes .it[data-pi="${PAL.sel}"]`); if (e) e.scrollIntoView({ block: 'nearest' }); }
function eligePal(i) { const r = PAL.items[i]; if (!r) return; cierraPaleta(); ve(r.ir[0], r.ir[1]); }

/* ---------- acciones ---------- */
document.addEventListener('click', ev => {
  const pi = ev.target.closest('[data-pi]'); if (pi) { eligePal(+pi.dataset.pi); return; }
  if (ev.target.id === 'paleta') { cierraPaleta(); return; }
  const salta = ev.target.closest('[data-salta]');
  if (salta) { ev.preventDefault(); const d = document.getElementById(salta.dataset.salta); if (d) { d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  const pl = ev.target.closest('[data-plegar]');
  if (pl) { const b = pl.dataset.plegar; const actual = APP.railAbierto[b] !== undefined ? APP.railAbierto[b] : (bloqueDeVista() === b); APP.railAbierto[b] = !actual; pintaRail(); return; }
  const tab = ev.target.closest('[data-tab]');
  if (tab) { const i = +tab.dataset.tab; const s = tab.dataset.ses; UI['car_' + s] = i; guardaUI(); $$('.tab').forEach(t => t.setAttribute('aria-selected', String(+t.dataset.tab === i))); $$('.carriles .ej').forEach((p, j) => p.hidden = j !== i); return; }
  const el = ev.target.closest('[data-ir],[data-ref],[data-acc]'); if (!el) return;
  if (el.dataset.ir) { ve(el.dataset.ir, el.dataset.id); if (el.dataset.saltaTras) { const d = document.getElementById(el.dataset.saltaTras); if (d) d.scrollIntoView({ block: 'start' }); } return; }
  if (el.dataset.ref) { ve('concepto', el.dataset.ref); return; }
  const acc = el.dataset.acc, k = el.dataset.k;
  if (acc === 'paleta') { abrePaleta(); return; }
  if (acc === 'tema') { const o = ['auto', 'light', 'dark']; UI.tema = o[(o.indexOf(UI.tema || 'auto') + 1) % 3]; guardaUI(); aplicaTema(); pintaRail(); return; }
  if (acc === 'copiar' || acc === 'ejecutar' || acc === 'vistaprev') {
    const bl = el.closest('.bloquecod'); const code = CODS[+bl.dataset.cod] || '';
    if (acc === 'copiar') copia(code);
    else if (acc === 'ejecutar') { let box = bl.querySelector('.cod-salida'); if (!box) { box = document.createElement('div'); box.className = 'cod-salida'; bl.appendChild(box); } ejecutaJS(code, box); }
    else vistaHTML(code, bl);
    return;
  }
  if (acc === 'hecho') {
    const nuevo = !hechoEj(k); marcaEj(k, 'h', nuevo); pintaRail();
    const panel = el.closest('.ej'); el.setAttribute('aria-pressed', String(nuevo)); el.textContent = nuevo ? 'Hecho ✓' : 'Marcar como hecho';
    const hd = panel.querySelector('header'); const ch = hd.querySelector('.chip.ok'); if (nuevo && !ch) hd.querySelector('h3').insertAdjacentHTML('beforebegin', '<span class="chip ok">Hecho</span>'); if (!nuevo && ch) ch.remove();
    const t = $(`.tab[aria-controls="${panel.id}"] .tl`); if (t) { const o = t.querySelector('.ok'); if (nuevo && !o) t.insertAdjacentHTML('beforeend', ' <span class="ok">✓</span>'); if (!nuevo && o) o.remove(); }
    const s = APP.porId[k.split(':')[0]]; const ps = $('.progreso-ses'); if (ps && s) ps.innerHTML = `<span class="small"><b>${nHechos(s)}</b> de ${s.ejercicios.length} ejercicios hechos</span><div class="barra"><i style="width:${nHechos(s) / s.ejercicios.length * 100}%"></i></div>`;
    if (nuevo) tosta(sesionCompleta(s) ? '¡Sesión completa!' : 'Marcado como hecho.');
    return;
  }
  if (acc === 'pista') {
    const { e } = localiza(k); const zona = document.querySelector(`[data-zona="${k}"]`); const n = +(zona.dataset.pistas || 0);
    if (n >= e.pistas.length) { tosta('No hay más pistas para este ejercicio.'); return; }
    zona.dataset.pistas = n + 1; const d = document.createElement('div'); d.className = 'desplegable pista md'; d.innerHTML = `<p><span class="et">Pista ${n + 1} de ${e.pistas.length}</span></p>` + md(e.pistas[n]); zona.appendChild(d); return;
  }
  if (acc === 'verif') { VERIF.ej = k; VERIF.res = null; ve('verif'); return; }
  if (acc === 'sol') {
    const { e } = localiza(k); const zona = document.querySelector(`[data-zona="${k}"]`);
    if (solVista(k) || zona.dataset.conf === '1') { muestraSol(zona, e, k); return; }
    zona.dataset.conf = '1'; const d = document.createElement('div'); d.className = 'desplegable';
    d.innerHTML = `<p class="aviso-sol">Antes de mirar: ¿lo has intentado de verdad?</p><p>Equivocarse y corregir fija mucho más que leer la respuesta correcta. Si abres la solución sin haber peleado un rato, el ejercicio no te va a servir de nada.</p><div class="acciones" style="border:0;padding-bottom:0"><button class="b" data-acc="sol" data-k="${k}" type="button">Lo he intentado, enséñamela</button><button class="b sec" data-acc="cancela" data-k="${k}" type="button">Sigo intentándolo</button></div>`;
    zona.appendChild(d); return;
  }
  if (acc === 'cancela') { const zona = document.querySelector(`[data-zona="${k}"]`); zona.dataset.conf = ''; zona.querySelectorAll('.desplegable').forEach(x => { if (x.querySelector('.aviso-sol')) x.remove(); }); return; }
  if (acc === 'resp') {
    const { q } = localizaPreg(k); if (!q || APP.estado.q[k]) return; const op = +el.dataset.op;
    APP.estado.q[k] = { ok: op === q.buena, op }; guarda();
    const box = el.closest('.preg'); const n = box.querySelector('.qn'); box.outerHTML = pregunta(q, k, box.classList.contains('diag') ? 'diag' : '', n ? +n.textContent : 0);
    return;
  }
  if (acc === 'correr') { correVerif(); return; }
  if (acc === 'limpiar') { VERIF.html = ''; VERIF.css = ''; VERIF.js = ''; VERIF.res = null; pinta(); return; }
  if (acc === 'exportar') { exporta(); return; }
  if (acc === 'importar') { importa(); return; }
  if (acc === 'borrar') { document.querySelector('[data-zona="borrado"]').innerHTML = `<div class="desplegable"><p class="aviso-sol">Esto borra todo tu progreso y no se puede deshacer.</p><p>Exporta antes si quieres conservarlo.</p><div class="acciones" style="border:0;padding-bottom:0"><button class="b" data-acc="borrar2" type="button">Sí, bórralo todo</button><button class="b sec" data-acc="borrarno" type="button">Mejor no</button></div></div>`; return; }
  if (acc === 'borrarno') { document.querySelector('[data-zona="borrado"]').innerHTML = ''; return; }
  if (acc === 'borrar2') { APP.estado = molde(); guarda(); pintaRail(); pinta(); tosta('Progreso borrado.'); return; }
});
function localiza(k) { const [sid, c] = k.split(':'); const s = APP.porId[sid]; const i = c === 'undefined' ? 3 : 'ABC'.indexOf(c); return { s, e: s.ejercicios[i] }; }
function localizaPreg(k) { const [sid, resto] = k.split(':'); const s = APP.porId[sid]; if (!s) return {}; if (resto === 'd') return { s, q: s.diag }; return { s, q: s.auto[+resto.slice(1)] }; }
async function exporta() {

  const nombreArch = 'lm-' + (APP.estado.alumno || 'progreso').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + new Date().toISOString().slice(0, 10) + '.json';
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { }
    if (dl) { try { await dl.save({ filename: nombreArch, data: datos }); tosta('Archivo guardado.'); } catch (e) { if (!e || e.code !== 'declined') tosta('No se ha podido guardar el archivo aquí. Descarga la versión en archivo del curso.', true); } return; }
  }
  const b = new Blob([datos], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  const nom = (APP.estado.alumno || 'progreso').toLowerCase().replace(/[^a-z0-9]+/g, '-'); a.download = 'lm-' + nom + '-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); tosta('Archivo descargado.');

function importa() {

  i.addEventListener('change', async () => { const f = i.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); APP.estado = sanea(j.estado || j); guarda(); pintaRail(); pinta(); tosta('Progreso importado.'); } catch (e) { tosta('Ese archivo no se puede leer.', true); } });

function muestraSol(zona, e, k) {

/* ---------- teclado ---------- */
