<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entornos de Desarrollo · DAM</title>
<style>
/* ============================================================
   Identidad: documento de especificación en pantalla.
   Los colores de estado son los estados de un enlace en el
   navegador: azul = actual, morado = ya visitado/hecho.
   ============================================================ */
:root{
  --papel:#181818;          /* fondo de la ventana */
  --lienzo:#1e1e1e;         /* la columna de lectura */
  --papel-2:#2a2a2a;        /* superficies secundarias */
  --tinta:#d4d4d4;
  --apagado:#8a8a8a;
  --regla:#3c3c3c;
  --regla-suave:#2a2a2a;
  --enlace:#4fc1ff;         /* azul: enlaces, foco, elemento actual */
  --enlace-claro:#163a52;
  --visitado:#c586c0;
  --ok:#4ec9b0;
  --mal:#f48771;
  --aviso:#dcdcaa;
  --mono:ui-monospace,"Cascadia Code",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rail:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);color:var(--tinta);
  font-family:var(--sans);font-size:16.5px;line-height:1.65;
  -webkit-text-size-adjust:100%;
}
a{color:var(--tinta)}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--enlace);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Estructura ---------- */
#app{display:flex;min-height:100vh;align-items:stretch}
#rail{
  width:var(--rail);flex:0 0 var(--rail);border-right:1px solid var(--regla);
  padding:18px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--papel);
}
#main{flex:1 1 auto;min-width:0;padding:26px 26px 90px;max-width:1280px}
.col{max-width:920px;background:var(--lienzo);border:1px solid var(--regla);
  padding:34px 40px 44px}

/* ---------- Rail ---------- */
.marca{padding:0 18px 14px;border-bottom:1px solid var(--regla);margin-bottom:12px}
.marca b{
  display:block;font-family:var(--mono);font-size:13px;letter-spacing:.02em;
  font-weight:700;line-height:1.35
}
.marca span{display:block;font-family:var(--mono);font-size:11px;color:var(--apagado);margin-top:4px}
.navgrupo{padding:10px 18px 4px}
.navgrupo>h3{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--apagado);margin:0 0 7px;font-weight:600
}
.navlink{
  display:block;width:100%;text-align:left;background:none;border:0;padding:5px 18px;
  font-size:14.5px;cursor:pointer;border-left:3px solid transparent;margin-left:-18px;
  width:calc(100% + 18px)
}
.navlink:hover{background:var(--papel-2)}
.navlink[aria-current="true"]{border-left-color:var(--enlace);color:var(--enlace);font-weight:600;background:var(--enlace-claro)}
.navlink .n{font-family:var(--mono);font-size:12px;color:var(--apagado);margin-right:8px}
.navlink[aria-current="true"] .n{color:var(--enlace)}
.navlink.hecho .n{color:var(--visitado)}
.navlink.hecho .n::after{content:"·"}
.navsub{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--apagado);margin:10px 0 2px;padding-left:2px
}

/* ---------- Ejercicio de programa completo ---------- */
.ej[data-carril="D"]{border-width:2px;border-color:var(--enlace)}
.ej[data-carril="D"]>header{background:var(--enlace-claro);border-bottom-color:var(--enlace)}
.ej[data-carril="D"] .carril{color:var(--enlace);font-weight:700}

/* ---------- Referencia: cuerpo con su indice al lado ---------- */
.fichacols{display:grid;grid-template-columns:1fr;gap:22px;margin-top:6px}
.fichacuerpo{min-width:0}
.fichaindice{min-width:0}
.idxtit{margin:0 0 8px;font:600 10.5px/1.5 var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--apagado)}
.idxlista{list-style:none;margin:0 0 22px;padding:0;border-left:2px solid var(--regla-suave)}
.idxlista li{margin:0}
.idxlista a,.idxlista button{display:block;width:100%;text-align:left;background:none;
  border:0;border-left:2px solid transparent;margin-left:-2px;padding:4px 10px;
  font:14px/1.45 var(--sans);color:var(--apagado);cursor:pointer;text-decoration:none}
.idxlista a:hover,.idxlista button:hover{color:var(--enlace);border-left-color:var(--enlace);
  background:var(--papel-2)}
.idxlista .aqui{color:var(--tinta);font-weight:600;border-left-color:var(--tinta)}
.idxlista ol{counter-reset:none}
.idxherm button{font-size:13.5px}

@media (min-width:1000px){
  .fichacols{grid-template-columns:minmax(0,1fr) 216px;gap:38px;align-items:start}
  .fichaindice{position:sticky;top:20px;max-height:calc(100vh - 44px);overflow:auto;
    padding-left:2px}
}

/* El paso a paso de la referencia añade el tema debajo del título */
.paso .tema{display:block;font:11px/1.5 var(--mono);color:var(--apagado);margin-top:3px;
  letter-spacing:.04em}

/* ---------- Buscador del rail ---------- */
.buscarail{padding:0 18px 12px}
.buscarail input{width:100%;font:13px/1.5 var(--mono);padding:6px 9px;
  border:1px solid var(--regla);background:var(--papel-2);color:var(--tinta);
  border-radius:0;-webkit-appearance:none}
.buscarail input::placeholder{color:var(--apagado)}
.sinres{font:12.5px/1.5 var(--sans);color:var(--apagado);margin:0}

/* ---------- Bloques plegables ---------- */
.navcab{display:flex;align-items:baseline;gap:8px;width:calc(100% + 18px);margin-left:-18px;
  padding:6px 18px;background:none;border:0;cursor:pointer;text-align:left;
  font:600 10.5px/1.5 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--apagado)}
.navcab:hover{background:var(--papel-2);color:var(--tinta)}
.navcab .flecha{font-size:12px;width:9px;flex:0 0 9px;text-align:center}
.navcab-t{flex:1 1 auto;min-width:0}
.navcab-n{font-size:10px;letter-spacing:.04em;opacity:.75}
.navgrupo.abierto>.navcab{color:var(--tinta)}

/* ---------- Pie de navegación entre sesiones ---------- */
.pasos{display:flex;gap:10px;margin:38px 0 0;padding-top:16px;
  border-top:1px solid var(--regla)}
.paso{flex:1 1 0;min-width:0;display:block;text-align:left;background:none;
  border:1px solid var(--regla);padding:10px 13px;cursor:pointer}
.paso:hover{background:var(--papel-2)}
.paso.der{text-align:right}
.paso .dir{display:block;font:600 10px/1.6 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--apagado)}
.paso .tit{display:block;font-size:14px;line-height:1.35;margin-top:2px}
.paso .tit .n{font-family:var(--mono);font-size:12px;color:var(--apagado);margin-right:6px}
.paso.vacio{visibility:hidden}

/* ---------- Cabecera móvil ---------- */
#barra{display:none;position:sticky;top:0;z-index:40;background:var(--papel);
  border-bottom:1px solid var(--regla);padding:8px 14px;align-items:center;gap:10px}
#barra b{font-family:var(--mono);font-size:13px}
.btnmenu{background:none;border:1px solid var(--regla);padding:6px 10px;font-family:var(--mono);
  font-size:12px;cursor:pointer}

/* ---------- Tipografía de contenido ---------- */
h1,h2,h3,h4{font-family:var(--mono);font-weight:700;line-height:1.28;letter-spacing:-.01em}
h1{font-size:31px;line-height:1.16;letter-spacing:-.015em;margin:0 0 10px}
h2{font-size:19px;margin:40px 0 12px;padding-top:14px;border-top:2px solid var(--tinta)}
h3{font-size:16px;margin:30px 0 8px}
/* El marcador de apartado solo en la columna de lectura, no en el rail. */
.col h3{position:relative;padding-left:14px;scroll-margin-top:18px}
.col h3::before{content:"";position:absolute;left:0;top:.42em;width:5px;height:5px;
  background:var(--enlace)}
h4{font-size:13.5px;margin:18px 0 4px}
p{margin:0 0 13px}
ul,ol{margin:0 0 13px;padding-left:22px}
li{margin:0 0 5px}
code{font-family:var(--mono);font-size:.88em;background:var(--papel-2);padding:1px 4px;
  overflow-wrap:anywhere;
  border:1px solid var(--regla);white-space:normal}
pre{font-family:var(--mono);font-size:13px;line-height:1.5;background:var(--papel-2);
  border:1px solid var(--regla);border-left:3px solid var(--tinta);padding:11px 13px;
  overflow-x:auto;margin:0 0 14px;white-space:pre;tab-size:2}
pre code{background:none;border:0;padding:0;white-space:pre;font-size:13px}
blockquote{margin:0 0 14px;padding:9px 13px;border-left:3px solid var(--aviso);
  background:var(--papel-2);font-size:14.5px}
blockquote p:last-child{margin:0}
.ref-rota{color:var(--mal);border-bottom:1px dotted var(--mal);cursor:help}
/* ---------- Bloques de codigo etiquetados ---------- */
.bloquecod{margin:0 0 14px}
.bloquecod pre{margin:0}
.cod-rotulo{font:600 11.5px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:5px 12px;border:1px solid var(--regla);border-bottom:0;background:var(--papel-2);
  display:flex;gap:7px;align-items:center;color:var(--apagado)}
.cod-marca{font-size:13px;line-height:1}
.cod-mal>.cod-rotulo{color:var(--mal);border-color:var(--mal);
  background:color-mix(in srgb,var(--mal) 7%,var(--papel-2))}
.cod-bien>.cod-rotulo{color:var(--ok);border-color:var(--ok);
  background:color-mix(in srgb,var(--ok) 7%,var(--papel-2))}
.cod-mal>pre{border-color:var(--mal)}
.cod-bien>pre{border-color:var(--ok)}

/* ---------- Diagramas SVG embebidos ---------- */
.diagrama{margin:4px 0 20px;padding:14px;border:1px solid var(--regla);background:var(--papel-2);
  text-align:center}
.diagrama svg{max-width:100%;height:auto;display:block;margin:0 auto}
.diagrama figcaption{margin-top:10px;font:600 12px/1.5 var(--mono);letter-spacing:.03em;
  color:var(--apagado);text-align:left}

/* ---------- Cajas de aviso ---------- */
.caja{margin:0 0 16px;padding:12px 15px;border:1px solid var(--regla);
  border-left:4px solid var(--apagado);background:var(--papel-2)}
.caja>*:last-child{margin-bottom:0}
.caja>p:first-of-type{margin-top:0}
.caja-tit{margin:0 0 6px;font:700 12px/1.4 var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:var(--apagado)}
.caja pre,.caja .bloquecod{margin-top:10px}
.caja-aviso{border-left-color:var(--aviso);
  background:color-mix(in srgb,var(--aviso) 6%,var(--papel))}
.caja-aviso .caja-tit{color:var(--aviso)}
.caja-error{border-left-color:var(--mal);
  background:color-mix(in srgb,var(--mal) 6%,var(--papel))}
.caja-error .caja-tit{color:var(--mal)}
.caja-clave{border-left-color:var(--enlace);
  background:color-mix(in srgb,var(--enlace) 5%,var(--papel))}
.caja-clave .caja-tit{color:var(--enlace)}
.caja-analogia{border-left-color:var(--visitado);
  background:color-mix(in srgb,var(--visitado) 5%,var(--papel))}
.caja-analogia .caja-tit{color:var(--visitado)}
.caja-pro{border-left-color:var(--ok);
  background:color-mix(in srgb,var(--ok) 5%,var(--papel))}
.caja-pro .caja-tit{color:var(--ok)}
h5{margin:0}
table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:14px}
th,td{border:1px solid var(--regla);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--papel-2);font-family:var(--mono);font-size:12.5px;font-weight:700}
hr{border:0;border-top:1px solid var(--regla);margin:22px 0}

/* ---------- Migas / ruta (elemento distintivo) ---------- */
.ruta{font-family:var(--mono);font-size:12px;color:var(--apagado);margin:0 0 14px;
  word-break:break-all}
.ruta i{font-style:normal;color:var(--regla)}
.ruta b{font-weight:400;color:var(--tinta)}

.subt{color:var(--apagado);font-size:15px;margin:0 0 18px;max-width:66ch}

/* ---------- Etiquetas ---------- */
.et{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--apagado);display:inline-block}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--regla);padding:2px 7px;
  display:inline-block;margin:0 5px 5px 0;background:var(--papel)}
.chip.entrega{border-color:var(--aviso);color:var(--aviso)}
.chip.ok{border-color:var(--ok);color:var(--ok)}

/* ---------- Fichas de sesión en el índice ---------- */
.bloqueh{margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--tinta)}
.bloqueh h2{border:0;padding:0;margin:0;font-size:16px}
.bloqueh p{margin:4px 0 0;font-size:13.5px;color:var(--apagado)}
.bloquetema{margin:46px 0 4px;padding:10px 0 10px;border-top:4px solid var(--tinta)}
.bloquetema:first-child{margin-top:6px;border-top:0}
.bloquetema h1{border:0;padding:0;margin:0;font-size:22px}
.lista{border-top:1px solid var(--regla)}
.fila{display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid var(--regla);padding:10px 4px;cursor:pointer}
.fila:hover{background:var(--papel-2)}
.fila .id{font-family:var(--mono);font-size:12.5px;color:var(--apagado);flex:0 0 44px}
.fila.hecha .id{color:var(--visitado)}
.fila .tt{flex:1 1 auto;font-size:15px}
.fila .tt small{display:block;color:var(--apagado);font-size:13px;line-height:1.45;margin-top:2px}
.fila .pr{font-family:var(--mono);font-size:11.5px;color:var(--apagado);flex:0 0 auto}

/* ---------- Ejercicios ---------- */
.ej{border:1px solid var(--regla);margin:0 0 16px;background:var(--papel)}
.ej>header{display:flex;gap:10px;align-items:center;padding:9px 13px;
  border-bottom:1px solid var(--regla);background:var(--papel-2);flex-wrap:wrap}
.ej>header .carril{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  border:1px solid var(--tinta);padding:1px 6px}
.ej[data-carril="A"]>header .carril{border-color:var(--ok);color:var(--ok)}
.ej[data-carril="B"]>header .carril{border-color:var(--enlace);color:var(--enlace)}
.ej[data-carril="C"]>header .carril{border-color:var(--visitado);color:var(--visitado)}
.ej>header h3{margin:0;font-size:14.5px;flex:1 1 auto}
.ej .cuerpo{padding:13px}
.ej .cuerpo>*:last-child{margin-bottom:0}
.acciones{display:flex;gap:8px;flex-wrap:wrap;padding:10px 13px;border-top:1px solid var(--regla)}
.b{background:var(--enlace);color:#fff;border:1px solid var(--enlace);padding:7px 14px;font-family:var(--mono);
  font-size:12.5px;cursor:pointer}
.b:hover{background:var(--tinta);color:var(--papel)}
.b.sec{background:var(--lienzo);border-color:var(--regla);color:var(--apagado)}
.b.sec:hover{background:var(--papel-2);color:var(--tinta)}
.b[aria-pressed="true"]{background:var(--visitado);border-color:var(--visitado);color:#fff}
.b:disabled{opacity:.45;cursor:not-allowed}
.desplegable{border-top:1px solid var(--regla);padding:13px;background:var(--papel-2)}
.desplegable>*:last-child{margin-bottom:0}
.aviso-sol{font-size:13px;color:var(--aviso);margin:0 0 10px;font-family:var(--mono)}

/* ---------- Preguntas ---------- */
.preg{border:1px solid var(--regla);padding:13px;margin:0 0 14px}
.preg .en{font-weight:600;margin:0 0 10px}
.op{display:block;width:100%;text-align:left;background:var(--papel);border:1px solid var(--regla);
  padding:7px 11px;margin:0 0 6px;cursor:pointer;font-size:14.5px}
.op:hover{background:var(--papel-2)}
.op.elegida{border-color:var(--tinta);border-width:2px;padding:6px 10px}
.op.buena{border-color:var(--ok);color:var(--ok);border-width:2px;padding:6px 10px}
.op.mala{border-color:var(--mal);color:var(--mal);border-width:2px;padding:6px 10px}
.explic{border-left:3px solid var(--regla);padding:8px 12px;margin-top:8px;font-size:14px;
  background:var(--papel-2)}
.explic>*:last-child{margin-bottom:0}

/* ---------- Verificador ---------- */
.campo{display:block;margin:0 0 12px}
.campo>span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--apagado);margin:0 0 4px}
textarea,input[type=text]{width:100%;font-family:var(--mono);font-size:13px;line-height:1.5;
  background:var(--papel-2);border:1px solid var(--regla);padding:9px;color:var(--tinta)}
textarea{min-height:190px;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto}
select{font-family:var(--mono);font-size:13px;padding:6px 8px;background:var(--papel-2);
  border:1px solid var(--regla);color:var(--tinta);max-width:100%}
.zona{border:2px dashed var(--regla);padding:16px;text-align:center;font-size:14px;
  color:var(--apagado);margin:0 0 12px}
.zona.sobre{border-color:var(--enlace);color:var(--enlace)}
.resultado{border:1px solid var(--regla);margin:14px 0 0}
.resultado>header{padding:9px 13px;border-bottom:1px solid var(--regla);background:var(--papel-2);
  font-family:var(--mono);font-size:13px}
.chk{display:flex;gap:10px;padding:8px 13px;border-bottom:1px solid var(--regla);font-size:14px}
.chk:last-child{border-bottom:0}
.chk .m{font-family:var(--mono);font-size:12px;flex:0 0 22px;font-weight:700}
.chk.si .m{color:var(--ok)}
.chk.no .m{color:var(--mal)}
.chk.duda .m{color:var(--aviso)}
.chk .d small{display:block;color:var(--apagado);font-size:12.5px;font-family:var(--mono);
  margin-top:2px;word-break:break-word}
#lienzo{position:absolute;left:-10000px;top:0;width:390px;overflow:hidden}

/* ---------- Progreso ---------- */
.medidor{border:1px solid var(--regla);padding:13px;margin:0 0 14px}
.medidor h3{margin:0 0 8px}
.barra{height:9px;background:var(--papel-2);border:1px solid var(--regla);position:relative}
.barra i{display:block;height:100%;background:var(--visitado)}
.cifra{font-family:var(--mono);font-size:12.5px;color:var(--apagado);margin-top:5px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:0 0 16px}

/* ---------- Avisos flotantes ---------- */
#tostadas{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column;
  gap:7px;max-width:min(360px,92vw)}
.tost{background:var(--tinta);color:var(--papel);padding:9px 13px;font-size:13.5px;
  font-family:var(--mono)}
.tost.mal{background:var(--mal)}

/* ---------- Pie ---------- */
.selloRail{margin:18px 14px 26px;padding-top:10px;border-top:1px solid var(--regla);
  font:11px/1.5 var(--mono);color:var(--apagado);letter-spacing:.02em}
.sello{margin-top:44px;padding-top:12px;border-top:1px solid var(--regla);
  font-family:var(--mono);font-size:11px;color:var(--apagado)}

/* ---------- Referencia ---------- */
.buscador{margin:0 0 18px}
.refitem{border-bottom:1px solid var(--regla);padding:9px 4px;width:100%;text-align:left;
  background:none;border-top:0;border-left:0;border-right:0;cursor:pointer}
.refitem:hover{background:var(--papel-2)}
.refitem b{display:block;font-size:15px;font-weight:600}
.refitem span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--apagado)}
.usadoen{font-size:13.5px;color:var(--apagado);margin:0 0 16px}
.usadoen a{color:var(--tinta)}

/* ---------- Enlaces internos ---------- */
.ref{color:var(--tinta);text-decoration:underline;cursor:pointer;background:none;border:0;
  padding:0;font:inherit}
.ref::before{content:"§";font-family:var(--mono);font-size:.85em;margin-right:2px}

@media (max-width:900px){
  #rail{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);width:min(86vw,320px);flex-basis:auto;
    transition:transform .18s;box-shadow:none;border-right:1px solid var(--tinta)}
  #rail.abierto{transform:none}
  #barra{display:flex}
  #main{padding:16px 14px 80px}
  h1{font-size:21px}
  pre{font-size:12px}
  .pasos{flex-direction:column}
}

/* ---------- Scrollbar oscura (documento propio dentro del iframe) ---------- */
html{ scrollbar-width: thin; scrollbar-color: #4f4f4f var(--papel); }
::-webkit-scrollbar{ width:12px; height:12px; }
::-webkit-scrollbar-track{ background:var(--papel); }
::-webkit-scrollbar-thumb{ background:#4f4f4f; border-radius:6px; border:3px solid var(--papel); }
::-webkit-scrollbar-thumb:hover{ background:#6f6f6f; }

/* ==========================================================================
   ACCESO UNIFICADO  (header + modal #modal-auth)
   Mismo marcado en todas las páginas (ver firebase-init.js → MÓDULO DE ACCESO).
   Todos los selectores llevan el prefijo .auth-header / .auth-modal para pesar
   más que las reglas de página (.page-xxx h2, p, button…). Las variables de la
   app se usan con un valor oscuro de reserva, así el bloque funciona tal cual
   también en páginas que no las definen (p. ej. entornos-desarrollo.html).
   ========================================================================== */
.auth-header,
.auth-modal{
  --auth-panel:  var(--surface-1, #252526);
  --auth-input:  var(--surface-3, #3c3c3c);
  --auth-line:   var(--divider, #5a5a5a);
  --auth-soft:   var(--border-strong, #333333);
  --auth-hover:  var(--hover-bg, #2a2d2e);
  --auth-fg:     var(--text-normal, #cccccc);
  --auth-strong: var(--text-strong, #ffffff);
  --auth-muted:  var(--text-muted, #8a8a8a);
  --auth-accent: var(--accent-blue, #4fc1ff);
  --auth-ok:     var(--accent-strong, #4ec9b0);
  --auth-danger: var(--danger, #f48771);
  --auth-action: #0e639c;
  --auth-action-hover: #1177bb;
  --auth-font:   var(--font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif);
}

/* ---------- Header: botón «Acceder» / usuario con sesión ---------- */
.auth-header{
  display:flex; align-items:center; gap:6px;
  font-family:var(--auth-font); font-size:12px; line-height:1; color:var(--auth-fg);
}
.auth-header[data-estado="cargando"]{ visibility:hidden; }  /* evita el parpadeo «Acceder» → usuario */
.auth-header [hidden]{ display:none !important; }
.auth-header .auth-trigger,
.auth-header .auth-logout{
  appearance:none; display:inline-flex; align-items:center; gap:6px;
  height:22px; margin:0; padding:0 8px;
  background:transparent; border:1px solid transparent; border-radius:3px;
  color:inherit; font:inherit; white-space:nowrap; cursor:pointer;
}
.auth-header .auth-trigger{ border-color:var(--auth-line); }
.auth-header .auth-trigger:hover,
.auth-header .auth-logout:hover{ background:var(--auth-hover); color:var(--auth-strong); }
.auth-header .auth-trigger:focus-visible,
.auth-header .auth-logout:focus-visible{ outline:1px solid var(--auth-accent); outline-offset:1px; }
.auth-header .auth-icon-solo{ display:none; }
.auth-header .auth-user{ display:inline-flex; align-items:center; gap:6px; min-width:0; }
.auth-header .auth-user-icon{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:18px; height:18px; border-radius:50%;
  background:var(--auth-ok); color:#123b34;
}
.auth-header .auth-user-name{
  max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:var(--auth-strong);
}
.auth-header .auth-user-rol{
  padding:2px 6px; border-radius:8px;
  background:var(--auth-ok); color:#1e1e1e; font-size:10px; font-weight:600;
}

/* Variante para páginas sin barra superior propia (apuntes, horario, calendario…) */
.auth-header--flotante{
  position:fixed; top:10px; right:14px; z-index:95;
  max-width:calc(100vw - 28px); padding:3px;
  background:var(--auth-panel); border:1px solid var(--auth-soft); border-radius:6px;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
}
.auth-header--flotante .auth-trigger{ border-color:transparent; }  /* ya lo enmarca el contenedor */
/* Dentro de un iframe manda el header de la página contenedora: aquí no se duplica. */
.auth-embebido .auth-header{ display:none !important; }

/* ---------- Modal de acceso ---------- */
html.auth-bloqueo,
html.auth-bloqueo body{ overflow:hidden; }
.auth-modal{
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center; padding:16px;
  font-family:var(--auth-font); font-size:13px; line-height:1.4; color:var(--auth-fg); text-align:left;
}
.auth-modal[hidden],
.auth-modal [hidden]{ display:none !important; }
.auth-modal .auth-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
.auth-modal .auth-card{
  position:relative; width:100%; max-width:360px; max-height:100%; overflow:auto;
  padding:22px 22px 20px;
  background:var(--auth-panel); border:1px solid var(--auth-line); border-radius:6px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
}
.auth-modal .auth-close{
  position:absolute; top:8px; right:8px; width:26px; height:26px; margin:0; padding:0;
  display:flex; align-items:center; justify-content:center;
  background:none; border:0; border-radius:3px;
  color:var(--auth-muted); font:18px/1 var(--auth-font); cursor:pointer;
}
.auth-modal .auth-close:hover{ background:var(--auth-hover); color:var(--auth-strong); }
.auth-modal .auth-close:focus-visible{ outline:1px solid var(--auth-accent); }
.auth-modal .auth-title{
  margin:0 0 14px; padding:0 28px 0 0;
  font:600 15px/1.3 var(--auth-font); color:var(--auth-strong);
}

/* Pestañas «Iniciar sesión» / «Crear cuenta» */
.auth-modal .auth-tabs{ display:flex; margin:0 0 16px; border-bottom:1px solid var(--auth-soft); }
.auth-modal .auth-tab{
  flex:1 1 0; margin:0 0 -1px; padding:8px 4px;
  background:none; border:0; border-bottom:2px solid transparent; border-radius:0;
  color:var(--auth-muted); font:500 13px/1.3 var(--auth-font); cursor:pointer;
}
.auth-modal .auth-tab:hover{ color:var(--auth-fg); }
.auth-modal .auth-tab.is-active{ color:var(--auth-strong); border-bottom-color:var(--auth-accent); }
.auth-modal .auth-tab:focus-visible{ outline:1px solid var(--auth-accent); outline-offset:-2px; }

/* Formulario */
.auth-modal .auth-form{ margin:0; padding:0; }
.auth-modal .auth-field{ display:block; margin:0 0 12px; }
.auth-modal .auth-field > span{ display:block; margin:0 0 4px; font-size:12px; color:var(--auth-muted); }
.auth-modal .auth-input{
  display:block; width:100%; height:auto; margin:0; padding:8px 10px;
  background:var(--auth-input); border:1px solid var(--auth-line); border-radius:3px;
  color:var(--auth-strong); font:13px/1.4 var(--auth-font); box-shadow:none;
}
.auth-modal .auth-input:focus{ outline:none; border-color:var(--auth-accent); box-shadow:0 0 0 1px var(--auth-accent); }
.auth-modal .auth-hint{ margin:-4px 0 12px; font-size:11.5px; line-height:1.4; color:var(--auth-muted); }
.auth-modal .auth-error{
  margin:0 0 12px; padding:7px 10px;
  background:rgba(244,135,113,.12); border-left:3px solid var(--auth-danger);
  color:var(--auth-danger); font-size:12px; line-height:1.4;
}
.auth-modal .auth-submit{
  display:block; width:100%; margin:0; padding:9px 0;
  background:var(--auth-action); border:0; border-radius:3px;
  color:#fff; font:600 13px/1.2 var(--auth-font); cursor:pointer;
}
.auth-modal .auth-submit:hover{ background:var(--auth-action-hover); }
.auth-modal .auth-submit:focus-visible{ outline:1px solid var(--auth-accent); outline-offset:2px; }
.auth-modal .auth-submit:disabled{ opacity:.6; cursor:progress; }

/* ---------- Responsive del acceso ---------- */
@media (max-width:900px){
  .auth-header--flotante .auth-label,
  .auth-header--flotante .auth-user-name,
  .auth-header--flotante .auth-user-rol{ display:none; }
  .auth-header--flotante .auth-icon-solo{ display:inline-block; }
}
@media (max-width:480px){
  .auth-header .auth-user-name{ max-width:96px; }
  .auth-header .auth-user-rol,
  .auth-header .auth-logout .auth-label{ display:none; }
  .auth-header .auth-icon-solo{ display:inline-block; }
  .auth-modal .auth-card{ padding:18px 16px; }
}

/* Cabecera móvil: deja sitio al header de acceso (flotante, arriba a la derecha). */
@media (max-width:900px){ #barra{padding-right:112px} }

  },
  sesiones: [],
  conceptos: [],
  railAbierto: {},

/* ---------- Parseo ---------- */

function troceaBloques(txt, marca) {
  const lineas = txt.split('\n');
  const res = [];
  let act = null, cuerpo = null, sub = null;

  const esMarca = l => /^@[SGQEPVZK](\s|$)/.test(l);

  for (const l of lineas) {
    if (!esMarca(l)) {
      if (cuerpo) cuerpo.push(l);
      else if (sub) sub.push(l);
      continue;
    }
    const tipo = l[1];
    const resto = l.slice(2).trim();
    const r = { tipo, cab: resto, cuerpo: [] };
    if (act) act.partes.push(r);
    if (tipo === marca) {
      act = { cab: resto, partes: [] };
      res.push(act);
      cuerpo = null;
      continue;
    }
    cuerpo = r.cuerpo;
  }
  return res;
}

function parseaSesiones(txt) {
  const brutos = troceaBloques(txt, 'S');
  return brutos.map(b => {
    const [id, bloque, titulo, objetivo, conceptos] = b.cab.split('|');
    const s = {
      id, bloque, titulo, objetivo,
      conceptos: (conceptos || '').split(',').filter(Boolean),
      guion: '', diag: null, ejercicios: [], auto: []
    };
    let ejAct = null;
    for (const p of b.partes) {
      if (p.tipo === 'G') { s.guion = p.cuerpo.join('\n').trim(); ejAct = null; }
      else if (p.tipo === 'Q') {
        const q = leePregunta(p);
        if (q.clase === 'd') s.diag = q; else s.auto.push(q);
        ejAct = null;
      }
      else if (p.tipo === 'E') {
        const [carril, tit, entrega] = p.cab.split('|');
        ejAct = {
          carril, titulo: tit, entrega: entrega === '1',
          enunciado: p.cuerpo.join('\n').trim(),
          pistas: [], checks: [], solucion: ''
        };
        s.ejercicios.push(ejAct);
      }
      else if (p.tipo === 'P' && ejAct) ejAct.pistas.push(p.cab);
      else if (p.tipo === 'V' && ejAct) ejAct.checks.push(p.cab.split('|'));
      else if (p.tipo === 'Z' && ejAct) ejAct.solucion = p.cuerpo.join('\n').trim();
    }
    return s;
  });
}

function leePregunta(p) {
  const [clase, ...resto] = p.cab.split('|');
  const q = { clase, enunciado: resto.join('|'), opciones: [], buena: 0, explic: '' };
  let enExplic = false;
  for (const l of p.cuerpo) {
    const t = l.trim();
    if (t.startsWith('- ')) { q.opciones.push(t.slice(2)); enExplic = false; }
    else if (t.startsWith('* ')) { q.buena = q.opciones.length; q.opciones.push(t.slice(2)); enExplic = false; }
    else if (t.startsWith('> ')) { q.explic = t.slice(2); enExplic = true; }
    else if (enExplic && t) q.explic += ' ' + t;
  }
  return q;
}

function parseaConceptos(txt) {
  return troceaBloques(txt, 'K').map(b => {
    const [id, tema, titulo] = b.cab.split('|');
    const cuerpo = [];
    for (const p of b.partes) cuerpo.push(...p.cuerpo);
    return { id, tema, titulo, cuerpo: cuerpo.join('\n').trim() };
  });
}

/* El parser de arriba mete el cuerpo del bloque K en el propio bloque:
   ajuste para recoger las líneas que van justo detrás de la cabecera. */
function parseaConceptosPlano(txt) {
  const lineas = txt.split('\n');
  const res = [];
  let act = null;
  for (const l of lineas) {
    if (/^@K\s/.test(l)) {
      const [id, tema, titulo] = l.slice(3).trim().split('|');
      act = { id, tema, titulo, cuerpo: [] };
      res.push(act);
    } else if (act) act.cuerpo.push(l);
  }
  return res.map(c => ({ ...c, cuerpo: c.cuerpo.join('\n').trim() }));
}

/* ---------- Renderizador de texto ---------- */

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function linea(t) {
  let s = esc(t);
  const codigos = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => {
    codigos.push(c);
    return '\u0000' + (codigos.length - 1) + '\u0000';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(ref:([a-z0-9-]+)\)/g,
    (m, txt, id) => `<button class="ref" data-ref="${id}">${txt}</button>`);
  // Forma compacta: [[ficha]] o [[ficha|texto a mostrar]]
  s = s.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, txt) => {
    const c = APP.refId[id];
    if (!c) return `<span class="ref-rota" title="Ficha inexistente: ${id}">${txt || id}</span>`;
    return `<button class="ref" data-ref="${id}">${txt || esc(c.titulo)}</button>`;
  });
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codigos[+i] + '</code>');
  return s;
}

function anclaDe(txt) {
  return 'sec-' + String(txt)
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/`|\*/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 50);
}

/* Devuelve los apartados de nivel ## de un cuerpo, para el indice lateral. */
function indiceDe(cuerpo) {
  const salida = [];
  let dentroDeCodigo = false;
  for (const l of String(cuerpo || '').split('\n')) {
    if (/^```/.test(l)) { dentroDeCodigo = !dentroDeCodigo; continue; }
    if (dentroDeCodigo) continue;
    if (/^##\s/.test(l) && !/^###/.test(l)) {
      const txt = l.slice(3).trim();
      salida.push({ id: anclaDe(txt), txt: txt.replace(/`/g, '') });
    }
  }
  return salida;
}

function md(txt) {
  if (!txt) return '';
  const ls = txt.split('\n');
  let out = '', i = 0;

  const cierra = (buf, tag) => buf.length ? `<${tag}>${buf.join('')}</${tag}>` : '';

  while (i < ls.length) {
    const l = ls[i];

    if (/^```/.test(l)) {
      // ```lenguaje|estado|Titulo   (estado: mal | bien | neutro)
      // ```svg|Pie de figura           -> diagrama vectorial embebido
      const cab = l.slice(3).trim().split('|');
      if ((cab[0] || '').trim() === 'svg') {
        const pie = (cab[1] || '').trim();
        const cuerpoSvg = [];
        i++;
        while (i < ls.length && !/^```/.test(ls[i])) { cuerpoSvg.push(ls[i]); i++; }
        i++;
        out += '<figure class="diagrama">' + cuerpoSvg.join('\n') +
          (pie ? '<figcaption>' + linea(pie) + '</figcaption>' : '') + '</figure>';
        continue;
      }
      const estado = (cab[1] || '').trim();
      const rotulo = (cab[2] || '').trim();
      const cuerpo = [];
      i++;
      while (i < ls.length && !/^```/.test(ls[i])) { cuerpo.push(ls[i]); i++; }
      i++;
      const cls = ['mal', 'bien'].includes(estado) ? ' cod-' + estado : '';
      let cabecera = '';
      if (rotulo || cls) {
        const marca = estado === 'mal' ? '\u2715' : estado === 'bien' ? '\u2713' : '';
        cabecera = '<div class="cod-rotulo">' +
          (marca ? '<span class="cod-marca">' + marca + '</span>' : '') +
          esc(rotulo) + '</div>';
      }
      out += '<div class="bloquecod' + cls + '">' + cabecera +
        '<pre><code>' + esc(cuerpo.join('\n')) + '</code></pre></div>';
      continue;
    }
    if (/^####\s/.test(l)) { out += '<h4>' + linea(l.slice(5)) + '</h4>'; i++; continue; }
    if (/^###\s/.test(l)) { out += '<h4>' + linea(l.slice(4)) + '</h4>'; i++; continue; }
    if (/^##\s/.test(l)) {
      const txt = l.slice(3);
      out += '<h3 id="' + anclaDe(txt) + '">' + linea(txt) + '</h3>';
      i++; continue;
    }
    if (/^\|/.test(l)) {
      const filas = [];
      while (i < ls.length && /^\|/.test(ls[i])) {
        const celdas = ls[i].replace(/^\|/, '').replace(/\|$/, '').split('|');
        if (!celdas.every(c => /^[-: ]*$/.test(c))) filas.push(celdas);
        i++;
      }
      if (filas.length) {
        out += '<table><thead><tr>' + filas[0].map(c => '<th>' + linea(c.trim()) + '</th>').join('') +
          '</tr></thead><tbody>' +
          filas.slice(1).map(f => '<tr>' + f.map(c => '<td>' + linea(c.trim()) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>';
      }
      continue;
    }
    if (/^:::/.test(l)) {
      const cab = l.slice(3).trim();
      const esp = cab.indexOf(' ');
      const tipo = (esp === -1 ? cab : cab.slice(0, esp)).toLowerCase() || 'nota';
      const titulo = esp === -1 ? '' : cab.slice(esp + 1).trim();
      const cuerpo = [];
      i++;
      while (i < ls.length && !/^:::\s*$/.test(ls[i])) { cuerpo.push(ls[i]); i++; }
      i++;
      const tipos = ['aviso', 'error', 'clave', 'analogia', 'pro', 'nota'];
      const cl = tipos.includes(tipo) ? tipo : 'nota';
      out += '<aside class="caja caja-' + cl + '">' +
        (titulo ? '<h5 class="caja-tit">' + linea(titulo) + '</h5>' : '') +
        md(cuerpo.join('\n')) + '</aside>';
      continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < ls.length && /^>\s?/.test(ls[i])) { buf.push(ls[i].replace(/^>\s?/, '')); i++; }
      out += '<blockquote>' + md(buf.join('\n')) + '</blockquote>';
      continue;
    }
    if (/^[-*]\s/.test(l)) {
      const buf = [];
      while (i < ls.length && (/^[-*]\s/.test(ls[i]) || (/^\s{2,}\S/.test(ls[i]) && buf.length))) {
        if (/^[-*]\s/.test(ls[i])) buf.push('<li>' + linea(ls[i].slice(2)));
        else buf[buf.length - 1] += ' ' + linea(ls[i].trim());
        i++;
      }
      out += cierra(buf.map(x => x + '</li>'), 'ul');
      continue;
    }
    if (/^\d+\.\s/.test(l)) {
      const buf = [];
      while (i < ls.length && (/^\d+\.\s/.test(ls[i]) || (/^\s{3,}\S/.test(ls[i]) && buf.length))) {
        if (/^\d+\.\s/.test(ls[i])) buf.push('<li>' + linea(ls[i].replace(/^\d+\.\s/, '')));
        else buf[buf.length - 1] += ' ' + linea(ls[i].trim());
        i++;
      }
      out += cierra(buf.map(x => x + '</li>'), 'ol');
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < ls.length && ls[i].trim() && !/^(```|#{2,4}\s|\||>|[-*]\s|\d+\.\s)/.test(ls[i])) {
      buf.push(ls[i].trim()); i++;
    }
    out += '<p>' + linea(buf.join(' ')) + '</p>';
  }
  return out;
}

/* ---------- Almacenamiento: por usuario, en Firebase ---------- */
/* Sin sesión: el progreso vive solo en memoria (APP.estado) y se pierde
   al recargar, a propósito. Con sesión: se guarda en Firestore, en un
   documento propio de cada usuario (nadie más puede leerlo ni escribirlo,
   según firestore.rules). */

function molde() {
  return { v: 1, alumno: '', ej: {}, q: {}, ts: 0 };
}

function sanea(x) {
  const m = molde();
  if (!x || typeof x !== 'object') return m;
  m.alumno = typeof x.alumno === 'string' ? x.alumno.slice(0, 60) : '';
  m.ts = typeof x.ts === 'number' ? x.ts : 0;
  if (x.ej && typeof x.ej === 'object') {
    for (const k of Object.keys(x.ej).slice(0, 4000)) {
      const e = x.ej[k];
      if (!e || typeof e !== 'object') continue;
      m.ej[k] = { h: !!e.h, sol: !!e.sol, t: typeof e.t === 'number' ? e.t : 0 };
    }
  }
  if (x.q && typeof x.q === 'object') {
    for (const k of Object.keys(x.q).slice(0, 4000)) {
      const q = x.q[k];
      if (!q || typeof q !== 'object') continue;
      m.q[k] = { ok: !!q.ok, op: typeof q.op === 'number' ? q.op : -1 };
    }
  }
  return m;
}

let temporizadorNube = null;
function guarda() {
  APP.estado.ts = Date.now();
  if (!window.__cuenta || !window.__cuenta.usuario) return; // sin sesión: no se guarda nada
  clearTimeout(temporizadorNube);
  temporizadorNube = setTimeout(() => { window.__cuenta.guardaNube(APP.estado); }, 1200);
}

async function carga() {
  if (window.__cuenta && window.__cuenta.usuario) {
    const remoto = await window.__cuenta.cargaNube();
    APP.estado = sanea(remoto);
  } else {
    APP.estado = molde();
  }
}

function tosta(txt, mal) {
  const d = document.createElement('div');
  d.className = 'tost' + (mal ? ' mal' : '');
  d.textContent = txt;
  document.getElementById('tostadas').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

/* ---------- Verificador ---------- */

const SIN_ETIQUETA = ['hidden', 'submit', 'button', 'reset', 'image'];

function limpiaDoc(doc) {
  doc.querySelectorAll('script,iframe,object,embed,link,base,meta[http-equiv]').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      if (a.name === 'href' && /^javascript:/i.test(a.value)) n.removeAttribute(a.name);
    });
  });
}

function alcanceCss(css, pref) {
  css = css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/@import[^;]*;/gi, '');
  let out = '', i = 0;
  while (i < css.length) {
    const abre = css.indexOf('{', i);
    if (abre === -1) break;
    const sel = css.slice(i, abre).trim();
    if (/^@(media|supports|layer|container)/i.test(sel)) {
      let n = 1, j = abre + 1;
      while (j < css.length && n > 0) { if (css[j] === '{') n++; if (css[j] === '}') n--; j++; }
      out += sel + '{' + alcanceCss(css.slice(abre + 1, j - 1), pref) + '}';
      i = j;
      continue;
    }
    let n = 1, j = abre + 1;
    while (j < css.length && n > 0) { if (css[j] === '{') n++; if (css[j] === '}') n--; j++; }
    const cuerpo = css.slice(abre + 1, j - 1);
    if (/^@/.test(sel)) out += sel + '{' + cuerpo + '}';
    else {
      const sels = sel.split(',').map(s => {
        s = s.trim();
        if (!s) return '';
        if (/^(html|body|:root)\b/i.test(s)) return pref + s.replace(/^(html|body|:root)/i, '');
        return pref + ' ' + s;
      }).filter(Boolean).join(',');
      if (sels) out += sels + '{' + cuerpo + '}';
    }
    i = j;
  }
  return out;
}

function lum(c) {
  const m = c.match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const p = m[1].split(',').map(x => parseFloat(x));
  if (p.length > 3 && p[3] === 0) return null;
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(p[0]) + 0.7152 * f(p[1]) + 0.0722 * f(p[2]);
}

function fondoReal(el, tope) {
  let n = el;
  while (n && n !== tope.parentNode) {
    const c = getComputedStyle(n).backgroundColor;
    const l = lum(c);
    if (l !== null) return l;
    n = n.parentElement;
  }
  return 1;
}

function cuenta(doc, sel) {
  try { return doc.querySelectorAll(sel).length; } catch (e) { return -1; }
}

async function inflaBase64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const flujo = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return await new Response(flujo).text();
}

function verifica(html, css, checks, js) {
  js = js || '';
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const hojas = [...doc.querySelectorAll('link[rel~="stylesheet" i]')]
    .map(x => ({ href: x.getAttribute('href') || '', enCabeza: !!x.closest('head') }));
  const guiones = [...doc.querySelectorAll('script')].map(x => ({
    src: x.getAttribute('src') || '',
    defer: x.hasAttribute('defer') || x.hasAttribute('async'),
    enCabeza: !!x.closest('head'),
    cuerpo: (x.textContent || '').trim()
  }));
  const manejadores = [...doc.querySelectorAll('*')]
    .filter(e => [...e.attributes].some(x => /^on/i.test(x.name))).length;
  limpiaDoc(doc);
  const res = [];
  const VISUALES = ['ancho390', 'contraste', 'computa', 'anchoen'];
  const necesitaPintar = checks.some(c => VISUALES.includes(c[0]));
  let caja = null;

  if (necesitaPintar) {
    const l = document.getElementById('lienzo');
    l.innerHTML = '';
    caja = document.createElement('div');
    caja.id = 'lienzoCaja';
    const anchoLienzo = (checks.find(c => c[0] === 'anchoen') || [])[1] || '390';
    caja.style.cssText = 'width:' + (+anchoLienzo || 390) + 'px';
    const base = document.createElement('style');
    base.textContent = '#lienzoCaja{background:#fff;color:#000;'
      + 'font-family:serif;font-size:16px;line-height:normal}';
    caja.appendChild(base);
    if (css.trim()) {
      const st = document.createElement('style');
      st.textContent = alcanceCss(css, '#lienzoCaja');
      caja.appendChild(st);
    }
    const env = document.createElement('div');
    env.innerHTML = doc.body ? doc.body.innerHTML : html;
    caja.appendChild(env);
    l.appendChild(caja);
  }

  for (const c of checks) {
    const t = c[0];
    if (t === 'doctype')
      res.push(r(!!doc.doctype, 'Declaración `<!DOCTYPE html>`',
        doc.doctype ? '' : 'No aparece, o no es la primera línea del documento'));
    else if (t === 'lang') {
      const v = doc.documentElement && doc.documentElement.getAttribute('lang');
      res.push(r(!!v, 'Idioma declarado en `<html lang>`', v ? 'lang="' + v + '"' : 'Falta el atributo lang'));
    }
    else if (t === 'charset') {
      const m = doc.querySelector('meta[charset]');
      res.push(r(!!m, 'Codificación declarada', m ? '' : 'Falta <meta charset="UTF-8">'));
    }
    else if (t === 'viewport') {
      const m = doc.querySelector('meta[name="viewport"]');
      const ok = m && /width\s*=\s*device-width/i.test(m.getAttribute('content') || '');
      res.push(r(!!ok, 'Etiqueta viewport para móviles',
        m ? (ok ? '' : 'Falta width=device-width en el content') : 'Falta la etiqueta viewport'));
    }
    else if (t === 'title') {
      const ti = (doc.title || '').trim();
      res.push(r(!!ti, 'Título de la pestaña', ti ? '«' + ti + '»' : 'Falta el <title> o está vacío'));
    }
    else if (t === 'sel') {
      const sel = c[1], min = +(c[2] || 1), max = c[3] ? +c[3] : Infinity;
      const n = cuenta(doc, sel);
      if (n < 0) { res.push(r(false, 'Selector `' + sel + '`', 'Selector no válido')); continue; }
      const ok = n >= min && n <= max;
      const esperado = max === Infinity ? ('al menos ' + min) : (min === max ? ('exactamente ' + min) : (min + ' a ' + max));
      res.push(r(ok, 'Elementos que encajan con `' + sel + '`', 'Encontrados ' + n + ', se esperaban ' + esperado));
    }
    else if (t === 'attr') {
      const els = [...doc.querySelectorAll(c[1])];
      const mal = els.filter(e => !(e.getAttribute(c[2]) || '').trim());
      if (!els.length) res.push(d('No hay elementos `' + c[1] + '` que comprobar', 'Ninguno encontrado'));
      else res.push(r(!mal.length, 'Todos los `' + c[1] + '` tienen `' + c[2] + '`',
        mal.length ? mal.length + ' sin ' + c[2] : els.length + ' comprobados'));
    }
    else if (t === 'texto') {
      const els = [...doc.querySelectorAll(c[1])];
      const ok = els.some(e => (e.textContent || '').toLowerCase().includes(c[2].toLowerCase()));
      res.push(r(ok, 'En `' + c[1] + '` aparece «' + c[2] + '»', ok ? '' : 'No se encuentra ese texto'));
    }
    else if (t === 'alt') {
      const imgs = [...doc.querySelectorAll('img')];
      const sin = imgs.filter(i => !i.hasAttribute('alt'));
      const vacios = imgs.filter(i => i.hasAttribute('alt') && !i.getAttribute('alt').trim());
      if (!imgs.length) res.push(d('No hay imágenes que comprobar', ''));
      else res.push(r(!sin.length, 'Todas las imágenes tienen `alt`',
        sin.length ? sin.length + ' sin alt' : imgs.length + ' imágenes, ' + vacios.length + ' con alt vacío (decorativas)'));
    }
    else if (t === 'labels') {
      const ctr = [...doc.querySelectorAll('input,select,textarea')]
        .filter(e => !SIN_ETIQUETA.includes((e.getAttribute('type') || '').toLowerCase()));
      const mal = ctr.filter(e => {
        if (e.closest('label')) return false;
        const id = e.getAttribute('id');
        if (id && doc.querySelector('label[for="' + CSS.escape(id) + '"]')) return false;
        if ((e.getAttribute('aria-label') || '').trim()) return false;
        return true;
      });
      if (!ctr.length) res.push(d('Etiquetas de los campos', 'No hay campos de formulario en esta pagina'));
      else res.push(r(!mal.length, 'Todos los campos tienen etiqueta',
        mal.length ? mal.length + ' campo(s) sin <label>: ' + mal.map(e => e.getAttribute('name') || e.tagName.toLowerCase()).join(', ')
          : ctr.length + ' campos comprobados'));
    }
    else if (t === 'nombres') {
      const ctr = [...doc.querySelectorAll('input,select,textarea')]
        .filter(e => !['submit', 'button', 'reset', 'image'].includes((e.getAttribute('type') || '').toLowerCase()));
      const mal = ctr.filter(e => !(e.getAttribute('name') || '').trim());
      if (!ctr.length) res.push(d('Atributo `name` de los campos', 'No hay campos de formulario en esta pagina'));
      else res.push(r(!mal.length, 'Todos los campos tienen `name`',
        mal.length ? mal.length + ' sin name: el dato no llegaría al servidor' : ctr.length + ' campos comprobados'));
    }
    else if (t === 'orden') {
      const hs = [...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(h => +h.tagName[1]);
      const h1 = hs.filter(x => x === 1).length;
      let salto = null;
      for (let k = 1; k < hs.length; k++) if (hs[k] > hs[k - 1] + 1) { salto = 'h' + hs[k - 1] + ' → h' + hs[k]; break; }
      const ok = h1 === 1 && !salto;
      res.push(r(ok, 'Jerarquía de encabezados',
        ok ? hs.length + ' encabezados, sin saltos'
          : (h1 !== 1 ? 'Hay ' + h1 + ' elementos h1, debe haber uno' : 'Salto de nivel: ' + salto)));
    }
    else if (t === 'noinline') {
      const n = doc.querySelectorAll('[style]').length;
      res.push(r(n === 0, 'Sin atributos `style`', n ? n + ' elemento(s) con style' : ''));
    }
    else if (t === 'noobs') {
      const obs = [...doc.querySelectorAll('font,center,marquee,big,strike,tt,blink,frame,frameset')];
      const pres = [...doc.querySelectorAll('[bgcolor],[align],[border]:not(table):not(img)')];
      const total = obs.length + pres.length;
      res.push(r(total === 0, 'Sin etiquetas ni atributos de presentación',
        total ? obs.map(e => '<' + e.tagName.toLowerCase() + '>').join(' ') + ' ' + (pres.length ? pres.length + ' atributo(s)' : '') : ''));
    }
    else if (t === 'unicoid') {
      const ids = [...doc.querySelectorAll('[id]')].map(e => e.getAttribute('id'));
      const rep = ids.filter((x, k) => ids.indexOf(x) !== k);
      res.push(r(!rep.length, 'Ningún `id` repetido', rep.length ? 'Repetidos: ' + [...new Set(rep)].join(', ') : ids.length + ' id comprobados'));
    }
    else if (t === 'anida') {
      const fallos = [];
      doc.querySelectorAll('ul,ol').forEach(l => {
        [...l.children].forEach(h => {
          if (!['LI', 'SCRIPT', 'TEMPLATE'].includes(h.tagName))
            fallos.push('<' + h.tagName.toLowerCase() + '> como hijo directo de <' + l.tagName.toLowerCase() + '>');
        });
      });
      doc.querySelectorAll('li').forEach(li => {
        if (!li.parentElement || !['UL', 'OL', 'MENU'].includes(li.parentElement.tagName))
          fallos.push('<li> fuera de una lista');
      });
      doc.querySelectorAll('dt,dd').forEach(e => {
        if (!e.closest('dl')) fallos.push('<' + e.tagName.toLowerCase() + '> fuera de <dl>');
      });
      doc.querySelectorAll('p').forEach(p => {
        if (p.querySelector('div,p,ul,ol,table,section,article'))
          fallos.push('bloque dentro de un <p>');
      });
      doc.querySelectorAll('a a').forEach(() => fallos.push('<a> dentro de otro <a>'));
      const u = [...new Set(fallos)];
      res.push(r(!u.length, 'Anidamiento válido', u.length ? u.slice(0, 4).join(' · ') : ''));
    }
    else if (t === 'ancho390' && caja) {
      const desb = [];
      caja.querySelectorAll('*').forEach(e => {
        const rc = e.getBoundingClientRect();
        const rb = caja.getBoundingClientRect();
        if (rc.width > 0 && rc.right > rb.left + 391.5) desb.push(e.tagName.toLowerCase());
      });
      const ok = caja.scrollWidth <= 391 && !desb.length;
      res.push(r(ok, 'Sin desbordamiento horizontal a 390 px',
        ok ? '' : 'Ancho real ' + caja.scrollWidth + ' px' + (desb.length ? ' · se sale: ' + [...new Set(desb)].slice(0, 4).join(', ') : '')));
    }
    else if (t === 'contraste' && caja) {
      const min = +(c[1] || 4.5);
      const malos = [];
      caja.querySelectorAll('*').forEach(e => {
        if (!e.textContent || !e.textContent.trim()) return;
        if ([...e.children].some(h => h.textContent.trim() === e.textContent.trim())) return;
        const cs = getComputedStyle(e);
        const lf = lum(cs.color);
        if (lf === null) return;
        const lb = fondoReal(e, caja);
        const ra = (Math.max(lf, lb) + 0.05) / (Math.min(lf, lb) + 0.05);
        if (ra < min) malos.push(e.tagName.toLowerCase() + ' (' + ra.toFixed(1) + ':1)');
      });
      res.push(r(!malos.length, 'Contraste de texto ≥ ' + min + ':1',
        malos.length ? [...new Set(malos)].slice(0, 4).join(', ') : ''));
    }
    else if (t === 'anchoen') { /* solo configura el lienzo */ }
    else if (t === 'cssenlace') {
      const ok = hojas.length > 0 && hojas.every(x => x.enCabeza && x.href.trim());
      let det = '';
      if (!hojas.length) det = 'No hay ning\u00fan <link rel="stylesheet">';
      else if (hojas.some(x => !x.href.trim())) det = 'Hay un <link> sin href';
      else if (hojas.some(x => !x.enCabeza)) det = 'El <link> debe ir dentro del <head>';
      else det = hojas.map(x => x.href).join(', ');
      res.push(r(ok, 'La hoja de estilos se enlaza desde el `<head>`', det));
    }
    else if (t === 'cssfuera') {
      const emb = doc.querySelectorAll('style').length;
      const inl = doc.querySelectorAll('[style]').length;
      const ok = !emb && !inl;
      const p = [];
      if (emb) p.push(emb + ' bloque(s) <style> en el HTML');
      if (inl) p.push(inl + ' atributo(s) style');
      res.push(r(ok, 'Todo el CSS vive en el archivo aparte', p.join(' · ')));
    }
    else if (t === 'cssusa' || t === 'cssevita') {
      const prop = (c[1] || '').trim();
      const min = +(c[2] || 1);
      const sinCom = css.replace(/\/\*[\s\S]*?\*\//g, '');
      const rx = new RegExp('(^|[;{\\s])' + prop.replace(/[-[\]{}()*+?.,\\^$|#]/g, '\\$&')
        + '\\s*:', 'gi');
      const n = (sinCom.match(rx) || []).length;
      if (t === 'cssusa')
        res.push(r(n >= min, 'La hoja usa `' + prop + '`',
          n ? n + ' declaración(es)' : 'No aparece en la hoja'));
      else
        res.push(r(n === 0, 'La hoja no usa `' + prop + '`',
          n ? n + ' declaración(es) encontradas' : ''));
    }
    else if (t === 'cssregla') {
      const rx = new RegExp(c[1], 'i');
      const sinCom = css.replace(/\/\*[\s\S]*?\*\//g, '');
      res.push(r(rx.test(sinCom), c[2] || ('La hoja contiene `' + c[1] + '`'),
        rx.test(sinCom) ? '' : 'No encontrado en el CSS'));
    }
    else if (t === 'media') {
      const min = +(c[1] || 1);
      const n = (css.match(/@media[^{]*\{/gi) || []).length;
      res.push(r(n >= min, 'Media queries', n + ' encontrada(s), se esperaban al menos ' + min));
    }
    else if (t === 'noimportant') {
      const n = (css.replace(/\/\*[\s\S]*?\*\//g, '').match(/!\s*important/gi) || []).length;
      res.push(r(n === 0, 'Sin `!important`',
        n ? n + ' uso(s): arregla el selector en vez de forzar la cascada' : ''));
    }
    else if (t === 'selcorto') {
      const max = +(c[1] || 3);
      const sinCom = css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/@media[^{]*\{/gi, '');
      const largos = [];
      sinCom.replace(/([^{}]+)\{/g, (_, s) => {
        s.split(',').forEach(x => {
          const partes = x.trim().split(/[\s>+~]+/).filter(Boolean);
          if (partes.length > max) largos.push(x.trim());
        });
        return '';
      });
      res.push(r(!largos.length, 'Ningún selector encadena más de ' + max + ' partes',
        largos.length ? largos.slice(0, 3).join(' · ') : ''));
    }
    else if (t === 'computa' && caja) {
      const sel = c[1], prop = c[2], esperado = c[3] || '';
      let els = [];
      try { els = [...caja.querySelectorAll(sel)]; }
      catch (e) { res.push(r(false, 'Selector `' + sel + '`', 'Selector no válido')); continue; }
      if (!els.length) {
        res.push(r(false, '`' + prop + '` en `' + sel + '`', 'Ningún elemento encaja con el selector'));
        continue;
      }
      const rx = new RegExp(esperado, 'i');
      const malos = els.filter(e => !rx.test(getComputedStyle(e)[prop] || ''));
      const muestra = getComputedStyle(els[0])[prop];
      res.push(r(!malos.length, '`' + prop + '` de `' + sel + '` es ' + esperado,
        malos.length ? 'Valor real: ' + muestra : muestra));
    }
    else if (t === 'computa')
      res.push(d('Comprobación visual no ejecutada', 'Hace falta contenido en el cuerpo'));
    else if (t === 'jsusa' || t === 'jsevita') {
      const patron = c[1] || '';
      const etiqueta = c[2] || ('`' + patron + '`');
      if (!js.trim()) {
        res.push(d(etiqueta, 'No has pegado ningún JavaScript'));
        continue;
      }
      const limpio = js.replace(/\/\*[\s\S]*?\*\//g, '').replace(/(^|[^:])\/\/[^\n]*/g, '$1');
      let hay = false;
      try { hay = new RegExp(patron).test(limpio); }
      catch (e) { res.push(r(false, etiqueta, 'Patrón no válido')); continue; }
      if (t === 'jsusa')
        res.push(r(hay, 'Usa ' + etiqueta, hay ? '' : 'No aparece en tu JavaScript'));
      else
        res.push(r(!hay, 'No usa ' + etiqueta, hay ? 'Aparece en tu JavaScript' : ''));
    }
    else if (t === 'scriptdefer') {
      const ext = guiones.filter(g => g.src);
      if (!ext.length) { res.push(d('El script se carga sin bloquear', 'No hay ningun <script src>')); continue; }
      const mal = ext.filter(g => g.enCabeza && !g.defer);
      res.push(r(!mal.length, 'El script se carga sin bloquear el dibujado',
        mal.length ? 'Hay un <script> en el <head> sin defer' : ''));
    }
    else if (t === 'jsfuera') {
      const emb = guiones.filter(g => !g.src && g.cuerpo).length;
      const p = [];
      if (emb) p.push(emb + ' bloque(s) <script> con codigo dentro del HTML');
      if (manejadores) p.push(manejadores + ' atributo(s) tipo onclick');
      res.push(r(!emb && !manejadores, 'Todo el JavaScript vive en el archivo aparte', p.join(' \u00b7 ')));
    }
    else if (t === 'ancho390' || t === 'contraste')
      res.push(d('Comprobación visual no ejecutada', 'Hace falta contenido en el cuerpo'));
  }
  if (caja) document.getElementById('lienzo').innerHTML = '';
  return res;

  function r(ok, titulo, detalle) { return { e: ok ? 'si' : 'no', titulo, detalle }; }
  function d(titulo, detalle) { return { e: 'duda', titulo, detalle }; }
}

</script>
<script>
/* ============================================================
   VISTAS
   ============================================================ */
'use strict';

const $ = s => document.querySelector(s);

function idsEj(s, i) { return s.id + ':' + 'ABC'[i]; }

function hechoEj(k) { return !!(APP.estado.ej[k] && APP.estado.ej[k].h); }
function solVista(k) { return !!(APP.estado.ej[k] && APP.estado.ej[k].sol); }

function marcaEj(k, campo, valor) {
  const e = APP.estado.ej[k] || { h: false, sol: false, t: 0 };
  e[campo] = valor;
  e.t = Date.now();
  APP.estado.ej[k] = e;
  guarda();
}

function sesionHecha(s) {
  return s.ejercicios.some((_, i) => hechoEj(idsEj(s, i)));
}
function sesionCompleta(s) {
  return s.ejercicios.every((_, i) => hechoEj(idsEj(s, i)));
}

/* ---------- Navegación ---------- */

function ve(v, id) {
  APP.vista = { v, id: id || null };
  pintaRail();
  pinta();
  $('#main').scrollIntoView({ block: 'start' });
  window.scrollTo(0, 0);
  $('#rail').classList.remove('abierto');
  $('#btnMenu').setAttribute('aria-expanded', 'false');
}

/* Bloque que se muestra desplegado si el usuario no ha tocado nada:
   el de la sesion abierta, o el de la primera sesion sin empezar. */
function bloqueDeVista() {
  const v = APP.vista;
  if (v.v === 'sesion' && APP.porId[v.id]) return APP.porId[v.id].bloque;
  const pendiente = APP.sesiones.find(s => !sesionHecha(s));
  if (pendiente) return pendiente.bloque;
  return APP.sesiones.length ? APP.sesiones[0].bloque : null;
}

function temaDeFicha(c) {
  const m = String(c.tema || '').match(/^(\d+)\./);
  return m ? m[1] : null;
}

function bloqueDeVistaRef() {
  const v = APP.vista;
  if (v.v === 'concepto' && APP.refId[v.id]) return temaDeFicha(APP.refId[v.id]);
  return APP.conceptos.length ? temaDeFicha(APP.conceptos[0]) : null;
}

function normaliza(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function buscaGlobal(q) {
  const n = normaliza(q);
  const ses = APP.sesiones.filter(s =>
    normaliza(s.id + ' ' + s.titulo + ' ' + s.objetivo).includes(n)).slice(0, 12);
  const con = APP.conceptos.filter(c =>
    normaliza(c.titulo + ' ' + c.tema + ' ' + c.cuerpo).includes(n)).slice(0, 12);
  return { ses, con };
}

function resultadosRail(q) {
  const { ses, con } = buscaGlobal(q);
  let h = '';
  if (!ses.length && !con.length) {
    return '<div class="navgrupo"><p class="sinres">Nada con esas palabras.</p></div>';
  }
  if (ses.length) {
    h += '<div class="navgrupo abierto"><h3>Sesiones</h3>';
    ses.forEach(s => {
      h += `<button class="navlink" data-ir="sesion" data-id="${s.id}">` +
        `<span class="n">${s.id}</span>${esc(s.titulo)}</button>`;
    });
    h += '</div>';
  }
  if (con.length) {
    h += '<div class="navgrupo abierto"><h3>Referencia</h3>';
    con.forEach(c => {
      h += `<button class="navlink" data-ir="concepto" data-id="${esc(c.id)}">` +
        `<span class="n">\u00a7</span>${esc(c.titulo)}</button>`;
    });
    h += '</div>';
  }
  return h;
}

function engancharBusqueda() {
  const b = $('#buscaRail');
  if (!b) return;
  b.addEventListener('input', () => {
    APP.filtroRail = b.value;
    const pos = b.selectionStart;
    pintaRail();
    const nb = $('#buscaRail');
    if (nb) { nb.focus(); try { nb.setSelectionRange(pos, pos); } catch (e) {} }
  });
  b.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { APP.filtroRail = ''; pintaRail(); $('#buscaRail').focus(); }
  });
}

function pintaRail() {
  const v = APP.vista;
  const abierto = bloqueDeVista();
  let h = `<div class="marca"><b>Entornos de Desarrollo</b><span>1.º DAM · 2026-2027</span></div>`;

  h += `<div class="buscarail"><input id="buscaRail" type="search" placeholder="Buscar sesión o ficha"
    aria-label="Buscar en el curso" autocomplete="off" value="${esc(APP.filtroRail || '')}"></div>`;

  if (APP.filtroRail && APP.filtroRail.trim().length > 1) {
    h += resultadosRail(APP.filtroRail.trim());
    h += `<div class="selloRail">v ${esc(APP.sello)}</div>`;
    $('#rail').innerHTML = h;
    engancharBusqueda();
    return;
  }

  h += `<div class="navgrupo"><h3>Ir a</h3>`;
  h += bot('curso', null, 'Curso', v.v === 'curso');
  h += bot('ref', null, 'Referencia', v.v === 'ref' || v.v === 'concepto');
  h += bot('verif', null, 'Verificador', v.v === 'verif');
  h += bot('progreso', null, 'Mi progreso', v.v === 'progreso');
  h += `</div>`;

  const enModoRef = (v.v === 'ref' || v.v === 'concepto');

  if (enModoRef) {
    const abiertoRef = bloqueDeVistaRef();
    for (const bId of Object.keys(APP.bloques)) {
      const b = APP.bloques[bId];
      const cs = APP.conceptos.filter(c => temaDeFicha(c) === bId);
      if (!cs.length) continue;
      const desplegado = APP.railAbiertoRef[bId] !== undefined
        ? APP.railAbiertoRef[bId] : (abiertoRef === bId);
      h += `<div class="navgrupo${desplegado ? ' abierto' : ''}">`;
      h += `<button class="navcab" data-plegarref="${bId}" aria-expanded="${desplegado}">` +
        `<span class="flecha" aria-hidden="true">${desplegado ? '\u2013' : '+'}</span>` +
        `<span class="navcab-t">${esc(b.n)} · ${esc(b.t)}</span>` +
        `<span class="navcab-n">${cs.length}</span></button>`;
      if (desplegado) {
        let subtemaActual = null;
        for (const c of cs) {
          if (c.tema !== subtemaActual) {
            subtemaActual = c.tema;
            h += `<div class="navsub">${esc(subtemaActual)}</div>`;
          }
          h += `<button class="navlink" data-ir="concepto" data-id="${esc(c.id)}"${v.id === c.id ? ' aria-current="true"' : ''}>` +
            `<span class="n">\u00a7</span>${esc(c.titulo)}</button>`;
        }
      }
      h += `</div>`;
    }
    h += `<div class="selloRail">v ${esc(APP.sello)}</div>`;
    $('#rail').innerHTML = h;
    engancharBusqueda();
    return;
  }

  for (const bId of Object.keys(APP.bloques)) {
    const b = APP.bloques[bId];
    const ses = APP.sesiones.filter(x => x.bloque === bId);
    const hechas = ses.filter(sesionHecha).length;
    const desplegado = APP.railAbierto[bId] !== undefined
      ? APP.railAbierto[bId] : (abierto === bId);
    h += `<div class="navgrupo${desplegado ? ' abierto' : ''}">`;
    h += `<button class="navcab" data-plegar="${bId}" aria-expanded="${desplegado}">` +
      `<span class="flecha" aria-hidden="true">${desplegado ? '\u2013' : '+'}</span>` +
      `<span class="navcab-t">${esc(b.t)}</span>` +
      `<span class="navcab-n">${hechas}/${ses.length}</span></button>`;
    if (desplegado) {
      for (const s of ses) {
        const cl = sesionHecha(s) ? ' hecho' : '';
        h += `<button class="navlink${cl}" data-ir="sesion" data-id="${s.id}"${v.id === s.id ? ' aria-current="true"' : ''}>` +
          `<span class="n">${s.id}</span>${esc(s.titulo)}</button>`;
      }
    }
    h += `</div>`;
  }
  h += `<div class="selloRail">v ${esc(APP.sello)}</div>`;
  $('#rail').innerHTML = h;
  engancharBusqueda();

  function bot(dest, id, txt, act) {
    return `<button class="navlink" data-ir="${dest}"${act ? ' aria-current="true"' : ''}>${esc(txt)}</button>`;
  }
}

/* ---------- Vista: índice del curso ---------- */

function vistaCurso() {
  let h = `<p class="ruta"><b>curso</b></p>
  <h1>Entornos de Desarrollo</h1>
  <p class="subt">1.º DAM · Curso 2026-2027 · 3 horas semanales. Cada sesión trae su guion, ejercicios en cuatro carriles según tu punto de partida y preguntas para comprobar lo que has entendido. Cada bloque cierra con un <b>programa completo</b> que junta todo lo del tema sobre el proyecto de la biblioteca. La teoría extensa vive en la <button class="ref" data-ir="ref">Referencia</button>. Las fichas de referencia se numeran por subtemas dentro de cada tema, y cada sesión indica cuáles usa. El curso cubre los seis resultados de aprendizaje del módulo 0487: <b>Tema 1</b> desarrollo de software, <b>Tema 2</b> entornos de desarrollo, <b>Tema 3</b> diagramas de clases, <b>Tema 4</b> diagramas de comportamiento, <b>Tema 5</b> pruebas, <b>Tema 6</b> optimización y documentación, y <b>Tema 7</b> control de versiones.</p>`;

  const total = APP.sesiones.length;
  const hechas = APP.sesiones.filter(sesionHecha).length;
  h += `<div class="medidor"><h3>Sesiones empezadas</h3>
    <div class="barra"><i style="width:${total ? Math.round(hechas / total * 100) : 0}%"></i></div>
    <p class="cifra">${hechas} de ${total}</p></div>`;

  for (const bId of Object.keys(APP.bloques)) {
    const b = APP.bloques[bId];
    const ses = APP.sesiones.filter(x => x.bloque === bId);
    h += `<div class="bloqueh"><h2>${esc(b.n)} · ${esc(b.t)}</h2><p>${esc(b.d)}</p></div><div class="lista">`;
    for (const s of ses) {
      const n = s.ejercicios.filter((_, i) => hechoEj(idsEj(s, i))).length;
      const cl = sesionCompleta(s) ? ' hecha' : '';
      const ent = s.ejercicios.some(e => e.entrega) ? ' · entrega' : '';
      h += `<button class="fila${cl}" data-ir="sesion" data-id="${s.id}">
        <span class="id">${s.id}</span>
        <span class="tt">${esc(s.titulo)}<small>${esc(s.objetivo)}</small></span>
        <span class="pr">${n}/3${ent}</span></button>`;
    }
    h += `</div>`;
  }
  return h;
}

/* ---------- Vista: sesión ---------- */

function vistaSesion(id) {
  const s = APP.porId[id];
  if (!s) return vistaCurso();
  const b = APP.bloques[s.bloque];
  const idx = APP.sesiones.indexOf(s);
  const ant = APP.sesiones[idx - 1], sig = APP.sesiones[idx + 1];

  let h = `<p class="ruta"><b>curso</b><i> / </i><b>bloque-${s.bloque}</b><i> / </i><b>${s.id.toLowerCase()}</b></p>
  <h1>${esc(s.titulo)}</h1>
  <p class="subt"><span class="et">Objetivo</span><br>${esc(s.objetivo)}</p>`;

  if (s.conceptos.length) {
    h += `<p class="usadoen">Referencia de esta sesión: ` +
      s.conceptos.map(c => APP.refId[c] ? `<button class="ref" data-ref="${c}">${esc(APP.refId[c].titulo)}</button>` : '')
        .filter(Boolean).join(' · ') + `</p>`;
  }

  h += md(s.guion);

  if (s.diag) {
    h += `<h2>Antes de empezar</h2>`;
    h += pregunta(s.diag, s.id + ':d');
  }

  h += `<h2>Ejercicios</h2>
  <p class="subt">Haz el que corresponda a tu punto de partida. Si acabas, no pases a la sesión siguiente: sube de carril en esta misma. El programa completo, cuando lo hay, se puede llevar a casa.</p>`;

  s.ejercicios.forEach((e, i) => { h += ejercicio(s, e, i); });

  if (s.auto.length) {
    h += `<h2>Autoevaluación</h2>`;
    s.auto.forEach((q, i) => { h += pregunta(q, s.id + ':a' + i); });
  }

  h += `<nav class="pasos" aria-label="Sesión anterior y siguiente">`;
  h += ant
    ? `<button class="paso" data-ir="sesion" data-id="${ant.id}"><span class="dir">\u2190 Anterior</span>` +
      `<span class="tit"><span class="n">${ant.id}</span>${esc(ant.titulo)}</span></button>`
    : `<span class="paso vacio"></span>`;
  h += sig
    ? `<button class="paso der" data-ir="sesion" data-id="${sig.id}"><span class="dir">Siguiente \u2192</span>` +
      `<span class="tit"><span class="n">${sig.id}</span>${esc(sig.titulo)}</span></button>`
    : `<span class="paso vacio"></span>`;
  h += `</nav>`;
  return h;
}

function ejercicio(s, e, i) {
  const k = idsEj(s, i);
  const hecho = hechoEj(k);
  const sol = solVista(k);
  const carriles = {
    A: 'Carril A \u00b7 m\u00ednimos',
    B: 'Carril B \u00b7 est\u00e1ndar',
    C: 'Carril C \u00b7 profundizar',
    D: 'Programa completo'
  };

  let h = `<div class="ej" data-carril="${e.carril}" id="ej-${k.replace(':', '-')}">
    <header><span class="carril">${esc(carriles[e.carril] || e.carril)}</span>
    <h3>${esc(e.titulo)}</h3>
    ${e.entrega ? '<span class="chip entrega">Entrega en Classroom</span>' : ''}
    ${hecho ? '<span class="chip ok">Hecho</span>' : ''}</header>
    <div class="cuerpo">${md(e.enunciado)}</div>`;

  h += `<div class="acciones">
    <button class="b" data-acc="hecho" data-k="${k}" aria-pressed="${hecho}">${hecho ? 'Hecho ✓' : 'Marcar como hecho'}</button>`;
  if (e.pistas.length)
    h += `<button class="b sec" data-acc="pista" data-k="${k}">Pista (${e.pistas.length})</button>`;
  if (e.checks.length)
    h += `<button class="b sec" data-acc="verif" data-k="${k}">Comprobar mi archivo</button>`;
  if (e.solucion)
    h += `<button class="b sec" data-acc="sol" data-k="${k}">${sol ? 'Ver solución' : 'Ver solución…'}</button>`;
  h += `</div><div data-zona="${k}"></div></div>`;
  return h;
}

function pregunta(q, k) {
  const r = APP.estado.q[k];
  let h = `<div class="preg" data-preg="${k}"><p class="en">${linea(q.enunciado)}</p>`;
  q.opciones.forEach((o, i) => {
    let cl = 'op';
    if (r) {
      if (i === q.buena) cl += ' buena';
      else if (i === r.op) cl += ' mala';
    }
    h += `<button class="${cl}" data-acc="resp" data-k="${k}" data-op="${i}"${r ? ' disabled' : ''}>${linea(o)}</button>`;
  });
  if (r) h += `<div class="explic">${md(q.explic)}</div>`;
  h += `</div>`;
  return h;
}

/* ---------- Vista: referencia ---------- */

let filtroRef = '';

function vistaRef() {
  let h = `<p class="ruta"><b>referencia</b></p>
  <h1>Referencia</h1>
  <p class="subt">La teoría, organizada por concepto y no por día. Está aquí para consultarla en marzo cuando no recuerdes de qué sesión era.</p>
  <div class="buscador"><label class="campo"><span>Buscar</span>
    <input type="text" id="busca" value="${esc(filtroRef)}" placeholder="rutas, alt, formulario, validador..."></label></div>`;

  const f = filtroRef.trim().toLowerCase();
  const temas = [];
  for (const c of APP.conceptos) if (!temas.includes(c.tema)) temas.push(c.tema);

  let n = 0;
  let bloqueActual = null;
  for (const t of temas) {
    const cs = APP.conceptos.filter(c => c.tema === t &&
      (!f || (c.titulo + ' ' + c.cuerpo + ' ' + c.tema).toLowerCase().includes(f)));
    if (!cs.length) continue;
    n += cs.length;
    const numTema = (t.match(/^(\d+)\./) || [])[1];
    const bInfo = numTema !== undefined ? APP.bloques[numTema] : null;
    if (bInfo && numTema !== bloqueActual) {
      bloqueActual = numTema;
      h += `<div class="bloquetema"><h1>${esc(bInfo.n)}: ${esc(bInfo.t)}</h1></div>`;
    }
    h += `<div class="bloqueh"><h2>${esc(t)}</h2></div>`;
    for (const c of cs)
      h += `<button class="refitem" data-ref="${c.id}"><b>${esc(c.titulo)}</b><span>#${c.id}</span></button>`;
  }
  if (!n) h += `<p>Nada encaja con «${esc(filtroRef)}». Prueba con otra palabra.</p>`;
  return h;
}

function vistaConcepto(id) {
  const c = APP.refId[id];
  if (!c) return vistaRef();

  const todas = APP.conceptos;
  const pos = todas.findIndex(x => x.id === id);
  const ant = pos > 0 ? todas[pos - 1] : null;
  const sig = pos >= 0 && pos < todas.length - 1 ? todas[pos + 1] : null;
  const hermanas = todas.filter(x => x.tema === c.tema);
  const usos = APP.sesiones.filter(s => s.conceptos.includes(id));
  const indice = indiceDe(c.cuerpo);

  let h = `<p class="ruta"><b>referencia</b><i> / </i>` +
    `<button class="ref" data-ir="ref" data-tema="${esc(c.tema)}">${esc(c.tema)}</button>` +
    `<i> / </i><b>#${esc(c.id)}</b></p>
  <h1>${esc(c.titulo)}</h1>`;

  if (usos.length)
    h += `<p class="usadoen">Se usa en ` + usos.map(s =>
      `<button class="ref" data-ir="sesion" data-id="${s.id}">${s.id} ${esc(s.titulo)}</button>`
    ).join(' \u00b7 ') + `</p>`;

  // Cuerpo con su indice al lado (debajo, en pantalla estrecha).
  h += `<div class="fichacols">`;
  h += `<article class="fichacuerpo">` + md(c.cuerpo) + `</article>`;

  h += `<nav class="fichaindice" aria-label="Contenido de la ficha">`;
  if (indice.length > 1) {
    h += `<h4 class="idxtit">En esta ficha</h4><ol class="idxlista">`;
    indice.forEach(s => {
      h += `<li><a href="#${esc(s.id)}" data-salta="${esc(s.id)}">${linea(s.txt)}</a></li>`;
    });
    h += `</ol>`;
  }
  if (hermanas.length > 1) {
    h += `<h4 class="idxtit">${esc(c.tema)}</h4><ul class="idxlista idxherm">`;
    hermanas.forEach(x => {
      h += `<li><button class="ref${x.id === id ? ' aqui' : ''}" data-ref="${esc(x.id)}"` +
        `${x.id === id ? ' aria-current="true"' : ''}>${esc(x.titulo)}</button></li>`;
    });
    h += `</ul>`;
  }
  h += `</nav></div>`;

  h += `<nav class="pasos" aria-label="Ficha anterior y siguiente">`;
  h += ant
    ? `<button class="paso" data-ref="${esc(ant.id)}"><span class="dir">\u2190 Anterior</span>` +
      `<span class="tit">${esc(ant.titulo)}</span><span class="tema">${esc(ant.tema)}</span></button>`
    : `<span class="paso vacio"></span>`;
  h += sig
    ? `<button class="paso der" data-ref="${esc(sig.id)}"><span class="dir">Siguiente \u2192</span>` +
      `<span class="tit">${esc(sig.titulo)}</span><span class="tema">${esc(sig.tema)}</span></button>`
    : `<span class="paso vacio"></span>`;
  h += `</nav>`;

  h += `<div class="acciones" style="padding-left:0">` +
    `<button class="b sec" data-ir="ref">\u2190 Toda la referencia</button></div>`;
  return h;
}

/* ---------- Vista: verificador ---------- */

const VERIF = { ej: '', html: '', css: '', js: '', res: null };

function listaVerificables() {
  const l = [];
  for (const s of APP.sesiones)
    s.ejercicios.forEach((e, i) => {
      if (e.checks.length) l.push({ k: idsEj(s, i), t: s.id + ' · ' + e.carril + ' · ' + e.titulo, checks: e.checks });
    });
  return l;
}

function vistaVerif() {
  const l = listaVerificables();
  let h = `<p class="ruta"><b>verificador</b></p>
  <h1>Verificador</h1>
  <p class="subt">Trae aquí el archivo que has escrito en VS Code y comprueba si cumple lo que pedía el ejercicio. No corrige el estilo ni las ideas: comprueba hechos, uno por uno, igual que lo haría el validador.</p>
  <label class="campo"><span>Ejercicio</span><select id="selEj">
    <option value="">Comprobación general (sin ejercicio)</option>`;
  for (const x of l) h += `<option value="${x.k}"${VERIF.ej === x.k ? ' selected' : ''}>${esc(x.t)}</option>`;
  h += `</select></label>
  <div class="zona" id="zona">Arrastra aquí tus archivos <code>.html</code>, <code>.css</code> y <code>.js</code>, o pégalos abajo</div>
  <label class="campo"><span>HTML</span><textarea id="txHtml" spellcheck="false" placeholder="Pega aquí el contenido de tu archivo .html">${esc(VERIF.html)}</textarea></label>
  <label class="campo"><span>CSS (opcional)</span><textarea id="txCss" spellcheck="false" style="min-height:110px" placeholder="Solo hace falta para las comprobaciones visuales">${esc(VERIF.css)}</textarea></label>
  <label class="campo"><span>JavaScript (opcional)</span><textarea id="txJs" spellcheck="false" style="min-height:110px" placeholder="Se lee para comprobar cómo está escrito; no se ejecuta">${esc(VERIF.js)}</textarea></label>
  <div class="acciones" style="padding-left:0"><button class="b" data-acc="correr">Comprobar</button>
  <button class="b sec" data-acc="limpiar">Vaciar</button></div>`;

  if (VERIF.res) {
    const bien = VERIF.res.filter(x => x.e === 'si').length;
    const mal = VERIF.res.filter(x => x.e === 'no').length;
    h += `<div class="resultado"><header>${bien} cumple · ${mal} falla${VERIF.res.length - bien - mal ? ' · ' + (VERIF.res.length - bien - mal) + ' sin comprobar' : ''}</header>`;
    for (const x of VERIF.res)
      h += `<div class="chk ${x.e}"><span class="m">${x.e === 'si' ? '✓' : x.e === 'no' ? '✗' : '?'}</span>
        <span class="d">${linea(x.titulo)}${x.detalle ? '<small>' + esc(x.detalle) + '</small>' : ''}</span></div>`;
    h += `</div>`;
    if (mal) h += `<blockquote><p>Arregla el primero de la lista y vuelve a comprobar. Un fallo suele arrastrar a otros, y a menudo desaparecen varios de golpe.</p></blockquote>`;
    h += `<p class="subt" style="margin-top:14px">Esto no sustituye a <button class="ref" data-ref="validacion-w3c">el validador del W3C</button>: comprueba lo que pedía el ejercicio, no toda la especificación.</p>`;
  }
  return h;
}

function correVerif() {
  const l = listaVerificables();
  const ej = l.find(x => x.k === VERIF.ej);
  const generales = [['doctype'], ['lang'], ['charset'], ['viewport'], ['title'], ['orden'],
  ['alt'], ['labels'], ['nombres'], ['unicoid'], ['noinline'], ['noobs'], ['anida'], ['ancho390']];
  const checks = ej ? ej.checks : generales;
  if (!VERIF.html.trim()) { tosta('Pega primero tu HTML.', true); return; }
  try {
    VERIF.res = verifica(VERIF.html, VERIF.css, checks, VERIF.js);
  } catch (e) {
    VERIF.res = null;
    tosta('No se ha podido analizar ese HTML.', true);
    return;
  }
  pinta();
  const r = document.querySelector('.resultado');
  if (r) r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ---------- Vista: progreso ---------- */

function vistaProgreso() {
  const totalEj = APP.sesiones.reduce((a, s) => a + s.ejercicios.length, 0);
  const hechos = Object.values(APP.estado.ej).filter(e => e.h).length;
  const soluciones = Object.values(APP.estado.ej).filter(e => e.sol).length;
  const qs = Object.values(APP.estado.q);
  const aciertos = qs.filter(q => q.ok).length;

  let h = `<p class="ruta"><b>progreso</b></p>
  <h1>Mi progreso</h1>
  <p class="subt">Esto es tuyo y se guarda en este navegador. No lo ve nadie más. Si cambias de ordenador, expórtalo y vuelve a importarlo.</p>
  <label class="campo"><span>Tu nombre</span><input type="text" id="nombre" value="${esc(APP.estado.alumno)}" placeholder="Para tus copias de seguridad"></label>
  <div class="rejilla">
    <div class="medidor"><h3>Ejercicios</h3>
      <div class="barra"><i style="width:${totalEj ? Math.round(hechos / totalEj * 100) : 0}%"></i></div>
      <p class="cifra">${hechos} de ${totalEj}</p></div>
    <div class="medidor"><h3>Autoevaluación</h3>
      <div class="barra"><i style="width:${qs.length ? Math.round(aciertos / qs.length * 100) : 0}%"></i></div>
      <p class="cifra">${aciertos} de ${qs.length} contestadas bien</p></div>
    <div class="medidor"><h3>Soluciones abiertas</h3>
      <p class="cifra" style="font-size:22px;color:var(--tinta)">${soluciones}</p>
      <p class="cifra">De ${hechos || 0} ejercicios marcados</p></div>
  </div>`;

  h += `<h2>Por sesión</h2><div class="lista">`;
  for (const s of APP.sesiones) {
    const n = s.ejercicios.filter((_, i) => hechoEj(idsEj(s, i))).length;
    const carriles = s.ejercicios.map((e, i) => hechoEj(idsEj(s, i)) ? e.carril : '·').join(' ');
    const qk = Object.keys(APP.estado.q).filter(x => x.startsWith(s.id + ':'));
    const qa = qk.filter(x => APP.estado.q[x].ok).length;
    h += `<button class="fila${n === 3 ? ' hecha' : ''}" data-ir="sesion" data-id="${s.id}">
      <span class="id">${s.id}</span>
      <span class="tt">${esc(s.titulo)}<small>Carriles: ${carriles}${qk.length ? ' · preguntas ' + qa + '/' + qk.length : ''}</small></span>
      <span class="pr">${n}/3</span></button>`;
